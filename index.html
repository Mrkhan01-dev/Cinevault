  <style>
    :root {
      --bg: #090b10;
      --surface: #111520;
      --surface-2: #181e2e;
      --surface-3: #222a3f;
      --text: #f3f6fc;
      --muted: #9aa5be;
      --accent: #e50914;
      --accent-2: #ff3b46;
      --gold: #f5b942;
      --border: rgba(255, 255, 255, 0.09);
      --radius: 14px;
      --shadow: 0 14px 34px rgba(0, 0, 0, 0.45);
      --max: 1320px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      background: radial-gradient(circle at top right, #181c2e 0%, var(--bg) 52%);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button, input, select {
      font-family: inherit;
      color: inherit;
    }

    button {
      cursor: pointer;
      border: none;
      background: none;
    }

    /* Header */
    header {
      position: sticky;
      top: 0;
      z-index: 40;
      backdrop-filter: blur(14px);
      background: rgba(9, 11, 16, 0.85);
      border-bottom: 1px solid var(--border);
    }

    .nav-wrap {
      max-width: var(--max);
      margin: 0 auto;
      padding: 14px 20px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      font-size: 1.25rem;
      letter-spacing: -0.02em;
    }

    .brand-badge {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--accent), #99040c);
      display: grid;
      place-items: center;
      font-size: 0.95rem;
      box-shadow: 0 6px 18px rgba(229, 9, 20, 0.35);
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .pill-btn {
      padding: 8px 14px;
      border-radius: 999px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      font-size: 0.88rem;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      transition: background 0.2s, border-color 0.2s;
    }

    .pill-btn:hover {
      background: var(--surface-3);
      border-color: rgba(255, 255, 255, 0.2);
    }

    .pill-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    .count-tag {
      background: rgba(255, 255, 255, 0.16);
      padding: 1px 7px;
      border-radius: 999px;
      font-size: 0.76rem;
    }

    /* Main */
    main {
      max-width: var(--max);
      margin: 0 auto;
      padding: 24px 20px 64px;
    }

    .hero {
      background: linear-gradient(135deg, rgba(229, 9, 20, 0.16), rgba(24, 30, 46, 0.92));
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 24px;
      margin-bottom: 22px;
      box-shadow: var(--shadow);
    }

    .hero h1 {
      font-size: clamp(1.5rem, 3.2vw, 2.2rem);
      font-weight: 800;
      letter-spacing: -0.025em;
      line-height: 1.15;
    }

    .hero p {
      color: var(--muted);
      font-size: 0.95rem;
      margin-top: 6px;
      margin-bottom: 16px;
      max-width: 660px;
    }

    .search-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
    }

    .search-input-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }

    .search-input {
      width: 100%;
      padding: 13px 42px 13px 16px;
      border-radius: 12px;
      background: var(--bg);
      border: 1px solid var(--border);
      font-size: 0.96rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-input:focus {
      border-color: var(--accent);
    }

    .clear-btn {
      position: absolute;
      right: 10px;
      width: 28px;
      height: 28px;
      border-radius: 8px;
      color: var(--muted);
      display: grid;
      place-items: center;
      font-size: 0.95rem;
    }

    .clear-btn:hover {
      color: var(--text);
      background: var(--surface-2);
    }

    .primary-btn {
      padding: 0 20px;
      border-radius: 12px;
      background: var(--accent);
      color: #fff;
      font-weight: 700;
      font-size: 0.92rem;
      transition: background 0.2s, transform 0.12s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .primary-btn:hover {
      background: var(--accent-2);
    }

    .primary-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    /* Filters */
    .filters {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 22px;
    }

    .filter-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
    }

    .chip-group {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .chip {
      padding: 7px 13px;
      border-radius: 999px;
      background: var(--surface);
      border: 1px solid var(--border);
      font-size: 0.84rem;
      font-weight: 600;
      color: var(--muted);
      transition: all 0.18s;
    }

    .chip:hover {
      color: var(--text);
      background: var(--surface-2);
    }

    .chip.active {
      background: var(--text);
      color: var(--bg);
      border-color: var(--text);
    }

    .sort-select {
      padding: 8px 12px;
      border-radius: 10px;
      background: var(--surface);
      border: 1px solid var(--border);
      font-size: 0.85rem;
      outline: none;
    }

    /* Section Meta */
    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      gap: 12px;
      flex-wrap: wrap;
    }

    .section-title {
      font-size: 1.2rem;
      font-weight: 700;
    }

    .result-meta {
      font-size: 0.86rem;
      color: var(--muted);
    }

    /* Grid */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(185px, 1fr));
      gap: 18px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
    }

    .card:hover {
      transform: translateY(-4px);
      border-color: rgba(255, 255, 255, 0.22);
      box-shadow: var(--shadow);
    }

    .poster-box {
      position: relative;
      aspect-ratio: 2 / 3;
      background: var(--surface-2);
      overflow: hidden;
      cursor: pointer;
    }

    .poster-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .rating-pill {
      position: absolute;
      top: 9px;
      left: 9px;
      background: rgba(9, 11, 16, 0.85);
      backdrop-filter: blur(6px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 3px 8px;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--gold);
    }

    .save-btn {
      position: absolute;
      top: 9px;
      right: 9px;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: rgba(9, 11, 16, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.14);
      display: grid;
      place-items: center;
      font-size: 0.92rem;
      transition: background 0.18s, transform 0.15s;
    }

    .save-btn:hover,
    .save-btn.saved {
      background: var(--accent);
      color: #fff;
    }

    .card-body {
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex: 1;
      cursor: pointer;
    }

    .card-title {
      font-size: 0.95rem;
      font-weight: 700;
      line-height: 1.3;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-sub {
      font-size: 0.78rem;
      color: var(--muted);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      margin-top: auto;
    }

    .type-badge {
      text-transform: uppercase;
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      padding: 2px 6px;
      border-radius: 6px;
      background: var(--surface-2);
      color: var(--text);
    }

    /* Non-intrusive Banner Ad Container below Grid */
    .ad-banner-wrap {
      margin-top: 28px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      flex-wrap: wrap;
    }

    .ad-banner-tag {
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      background: var(--surface-2);
      border: 1px solid var(--border);
      padding: 2px 8px;
      border-radius: 999px;
      font-weight: 700;
      flex-shrink: 0;
    }

    .ad-banner-content {
      flex: 1 1 260px;
      min-height: 36px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .ad-promo-link {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--text);
    }

    .ad-promo-link:hover {
      color: var(--gold);
    }

    /* Load More Bar */
    .load-more-wrap {
      margin-top: 22px;
      display: flex;
      justify-content: center;
    }

    .empty-state {
      background: var(--surface);
      border: 1px dashed rgba(255, 255, 255, 0.18);
      border-radius: var(--radius);
      padding: 36px 20px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .empty-state p {
      color: var(--muted);
      max-width: 440px;
      font-size: 0.92rem;
    }

    /* Modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 60;
      background: rgba(5, 7, 11, 0.84);
      backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
      overflow-y: auto;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal {
      width: 100%;
      max-width: 840px;
      max-height: 90vh;
      overflow-y: auto;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.7);
      position: relative;
    }

    .modal-close {
      position: sticky;
      top: 12px;
      float: right;
      margin: 12px 12px 0 0;
      z-index: 5;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(9, 11, 16, 0.88);
      border: 1px solid var(--border);
      font-size: 1.1rem;
      display: grid;
      place-items: center;
    }

    .modal-close:hover {
      background: var(--accent);
    }

    .modal-hero {
      display: grid;
      grid-template-columns: 215px 1fr;
      gap: 20px;
      padding: 22px;
    }

    .modal-poster {
      width: 100%;
      aspect-ratio: 2 / 3;
      border-radius: 12px;
      object-fit: cover;
      background: var(--surface-2);
    }

    .modal-title {
      font-size: 1.5rem;
      font-weight: 800;
      line-height: 1.2;
    }

    .modal-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 10px 0 14px;
      font-size: 0.83rem;
      color: var(--muted);
    }

    .modal-meta span {
      background: var(--surface-2);
      padding: 4px 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
    }

    .modal-overview {
      font-size: 0.94rem;
      color: #d7deed;
      margin-bottom: 16px;
    }

    .modal-section {
      padding: 16px 22px 22px;
      border-top: 1px solid var(--border);
    }

    .modal-section h3 {
      font-size: 1rem;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .provider-list,
    .cast-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .provider-pill,
    .cast-pill {
      background: var(--surface-2);
      border: 1px solid var(--border);
      padding: 6px 12px;
      border-radius: 10px;
      font-size: 0.82rem;
    }

    .provider-pill {
      font-weight: 600;
      color: #e6ecfa;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .provider-link {
      cursor: pointer;
      transition: background 0.18s, border-color 0.18s, transform 0.15s;
    }

    .provider-link:hover {
      background: var(--surface-3);
      border-color: var(--gold);
      color: #fff;
      transform: translateY(-1px);
    }

    .trailer-box {
      position: relative;
      aspect-ratio: 16 / 9;
      border-radius: 12px;
      overflow: hidden;
      background: #05070b;
      border: 1px solid var(--border);
    }

    .trailer-box iframe {
      width: 100%;
      height: 100%;
      border: 0;
    }

    .info-note {
      font-size: 0.85rem;
      color: var(--muted);
      background: var(--surface-2);
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .yt-fallback-btn {
      padding: 8px 14px;
      border-radius: 999px;
      background: var(--accent);
      color: #fff;
      font-size: 0.8rem;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .yt-fallback-btn:hover {
      background: var(--accent-2);
    }

    .similar-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 12px;
    }

    .similar-card {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      cursor: pointer;
      text-align: left;
    }

    .similar-card img {
      width: 100%;
      aspect-ratio: 2 / 3;
      object-fit: cover;
      display: block;
    }

    .similar-card p {
      padding: 7px 8px;
      font-size: 0.78rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    footer {
      max-width: var(--max);
      margin: 0 auto;
      padding: 20px;
      border-top: 1px solid var(--border);
      color: var(--muted);
      font-size: 0.82rem;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 10px;
    }

    @media (max-width: 640px) {
      .modal-hero {
        grid-template-columns: 1fr;
      }
      .modal-poster {
        max-width: 190px;
        margin: 0 auto;
      }
      .grid {
        grid-template-columns: repeat(auto-fill, minmax(145px, 1fr));
        gap: 12px;
      }
    }
  </style>

  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "CineVault",

</head>
<body>
  <header>
    <div class="nav-wrap">
      <a class="brand" href="#top" id="homeLink">
        <span class="brand-badge">▶</span>
        <span>CineVault</span>
      </a>

      <div class="nav-actions">
        <button class="pill-btn active" id="catalogTabBtn" type="button">Explore</button>
        <a class="pill-btn" href="guides.html">Guides</a>

      </div>

  <main id="top">
    <section class="hero">
      <h1>Movies &amp; Series</h1>
      <p>Browse trending releases, search titles, watch trailers, check where to stream, and save favorites to your watchlist.</p>

      <form class="search-row" id="searchForm">
        <div class="search-input-wrap">
          <input
            class="search-input"
            id="searchInput"
            type="search"

          />

        <button class="primary-btn" type="submit">Search</button>
      </form>
    </section>

    <section class="filters" aria-label="Filters">
      <div class="filter-row">
        <div class="chip-group" id="typeChips">

        <select class="sort-select" id="sortSelect" aria-label="Sort titles">

    <div class="section-head">
      <h2 class="section-title" id="sectionTitle">Trending Now</h2>
      <span class="result-meta" id="resultMeta"></span>
    </div>

    <section class="grid" id="movieGrid" aria-live="polite"></section>

    <!-- Non-intrusive Banner Ad Slot below the movie grid -->
    <aside class="ad-banner-wrap" id="adBannerSlot" aria-label="Sponsored Banner">
      <span class="ad-banner-tag">Sponsored</span>
      <div class="ad-banner-content" id="adBannerInner"></div>
    </aside>

    <div class="load-more-wrap" id="loadMoreWrap">
      <button class="primary-btn" style="padding: 12px 24px;" id="loadMoreBtn" type="button">Load More Titles</button>
    </div>
  </main>

  <div class="modal-backdrop" id="detailModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal">
      <button class="modal-close" id="closeDetailModal" type="button" aria-label="Close modal">✕</button>
      <div id="detailContent"></div>
    </div>
  </div>

  <footer>
    <span>CineVault</span>
    <span>Watchlist saved locally in your browser</span>
  </footer>

      function hasTmdbSource() {
        return Boolean((API_PROXY_URL || "").trim() || (DIRECT_TMDB_V3_KEY || "").trim());

      function buildTmdbUrl(path, params = {}) {
        const cleanPath = path.startsWith("/") ? path : `/${path}`;
        const proxy = (API_PROXY_URL || "").trim().replace(/\/+$/, "");
        const key = (DIRECT_TMDB_V3_KEY || "").trim();

        const query = new URLSearchParams();
        for (const [k, v] of Object.entries(params)) {
          if (v !== undefined && v !== null && v !== "") {
            query.set(k, String(v));
          }
        }

        if (proxy) {
          const qs = query.toString();
          return `${proxy}${cleanPath}${qs ? `?${qs}` : ""}`;
        }

        query.set("api_key", key);
        return `https://api.themoviedb.org/3${cleanPath}?${query.toString()}`;
      }

      function mapTmdbResult(r, idx) {
        const title = r.title || r.name || "Untitled";
        const dateStr = r.release_date || r.first_air_date || "";
        const year = parseInt(dateStr.slice(0, 4), 10) || 2025;
        const isTv = r.media_type === "tv" || Boolean(r.name && !r.title);
        const genreIds = Array.isArray(r.genre_ids) ? r.genre_ids : [];
        const mappedKeys = [];
        const mappedLabels = [];

        for (const gid of genreIds) {
          const info = GENRE_MAP[gid];
          if (info) {
            if (!mappedKeys.includes(info.key)) mappedKeys.push(info.key);
            if (!mappedLabels.includes(info.label)) mappedLabels.push(info.label);
          }
        }
        if (!mappedLabels.length) {
          mappedLabels.push(isTv ? "Series" : "Movie");
        }

        const fallbackItem = FALLBACK_ITEMS[idx % FALLBACK_ITEMS.length];
        return {
          id: `tmdb-${isTv ? "tv" : "movie"}-${r.id}`,
          tmdbId: r.id,
          media_type: isTv ? "tv" : "movie",
          title,
          year,
          rating: Number(r.vote_average || 7.5),
          popularity: Number(r.popularity || 50),
          runtime: isTv ? "TV Series" : "Feature Film",
          poster_path: r.poster_path || "",
          genres: mappedKeys,
          genreLabels: mappedLabels,
          accent: fallbackItem.accent,
          overview: r.overview || "Synopsis not available.",
          cast: [],
          providers: [],
          trailerKey: ""
        };
      }

      async function fetchCatalogPage(pageToLoad = 1, append = false) {
        if (!hasTmdbSource()) {
          state.items = FALLBACK_ITEMS.slice();
          state.page = 1;
          state.totalPages = 1;
          renderGrid();
          return;
        }

        state.isLoadingPage = true;
        els.loadMoreBtn.disabled = true;
        els.loadMoreBtn.textContent = "Loading...";

        try {
          const q = state.query.trim();
          let url = "";

          if (q) {
            const searchEndpoint =
              state.mediaType === "movie"
                ? "/search/movie"
                : state.mediaType === "tv"
                ? "/search/tv"
                : "/search/multi";
            url = buildTmdbUrl(searchEndpoint, { query: q, page: pageToLoad, include_adult: false });
          } else if (state.mediaType === "movie") {
            url = buildTmdbUrl("/trending/movie/week", { page: pageToLoad });
          } else if (state.mediaType === "tv") {
            url = buildTmdbUrl("/trending/tv/week", { page: pageToLoad });
          } else {
            url = buildTmdbUrl("/trending/all/week", { page: pageToLoad });
          }

          const res = await fetch(url);
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const data = await res.json();
          const rawList = Array.isArray(data.results) ? data.results : [];

          const mapped = rawList
            .filter((r) => r && (r.media_type !== "person") && (r.title || r.name))
            .map((r, i) => mapTmdbResult(r, i));

          state.page = Number(data.page || pageToLoad);
          state.totalPages = Math.min(Number(data.total_pages || 1), 20);

          if (append) {
            const seen = new Set(state.items.map((x) => x.id));
            const uniqueNew = mapped.filter((x) => !seen.has(x.id));
            state.items = state.items.concat(uniqueNew);
          } else {
            state.items = mapped.length ? mapped : FALLBACK_ITEMS.slice();
          }
        } catch {
          if (!append && (!state.items || !state.items.length)) {
            state.items = FALLBACK_ITEMS.slice();
          }
        } finally {
          state.isLoadingPage = false;
          renderGrid();
        }
      }

      async function enrichTitleDetails(item) {
        if (!item || !item.tmdbId || !hasTmdbSource()) return item;
        const type = item.media_type === "tv" ? "tv" : "movie";

        try {
          const [detailsRes, videosRes, providersRes, creditsRes] = await Promise.allSettled([
            fetch(buildTmdbUrl(`/${type}/${item.tmdbId}`)),
            fetch(buildTmdbUrl(`/${type}/${item.tmdbId}/videos`)),
            fetch(buildTmdbUrl(`/${type}/${item.tmdbId}/watch/providers`)),
            fetch(buildTmdbUrl(`/${type}/${item.tmdbId}/credits`))
          ]);

          if (detailsRes.status === "fulfilled" && detailsRes.value.ok) {
            const d = await detailsRes.value.json();
            if (Array.isArray(d.genres) && d.genres.length) {
              item.genreLabels = d.genres.map((g) => g.name).filter(Boolean);
            }
            if (typeof d.runtime === "number" && d.runtime > 0) {
              const h = Math.floor(d.runtime / 60);
              const m = d.runtime % 60;
              item.runtime = h > 0 ? `${h}h ${m}m` : `${m}m`;
            } else if (Array.isArray(d.episode_run_time) && d.episode_run_time[0]) {
              item.runtime = `${d.episode_run_time[0]}m / ep`;
            }
          }

          if (videosRes.status === "fulfilled" && videosRes.value.ok) {
            const v = await videosRes.value.json();
            const videos = Array.isArray(v.results) ? v.results : [];
            const ytTrailer =
              videos.find((vid) => vid.site === "YouTube" && vid.type === "Trailer" && vid.key) ||
              videos.find((vid) => vid.site === "YouTube" && vid.type === "Teaser" && vid.key) ||
              videos.find((vid) => vid.site === "YouTube" && vid.key);
            if (ytTrailer) {
              item.trailerKey = ytTrailer.key;
            }
          }

          if (providersRes.status === "fulfilled" && providersRes.value.ok) {
            const p = await providersRes.value.json();
            const regionData =
              (p.results && p.results[WATCH_REGION]) ||
              (p.results && p.results.US) ||
              (p.results && Object.values(p.results)[0]);
            if (regionData) {
              const names = new Set();
              for (const bucket of ["flatrate", "rent", "buy", "ads"]) {
                if (Array.isArray(regionData[bucket])) {
                  for (const prov of regionData[bucket]) {
                    if (prov.provider_name) names.add(prov.provider_name);
                  }
                }
              }
              item.providers = Array.from(names).slice(0, 8);
            }
          }

          if (creditsRes.status === "fulfilled" && creditsRes.value.ok) {
            const c = await creditsRes.value.json();
            if (Array.isArray(c.cast) && c.cast.length) {
              item.cast = c.cast.slice(0, 8).map((person) => person.name).filter(Boolean);
            }
          }
        } catch {
          // Keep existing data
        }
        return item;
      }

      function getFilteredItems() {
        const base = state.view === "watchlist" ? state.watchlist.slice() : state.items.slice();
        const q = state.query.trim().toLowerCase();

        const list = base.filter((item) => {
          if (state.mediaType !== "all" && item.media_type !== state.mediaType) {
            return false;
          }
          if (state.genre !== "all") {
            const g = Array.isArray(item.genres) ? item.genres : [];
            if (!g.includes(state.genre)) return false;
          }
          if (q && !hasTmdbSource()) {
            const hay = `${item.title || ""} ${item.overview || ""} ${(item.genreLabels || []).join(" ")}`.toLowerCase();
            if (!hay.includes(q)) return false;
          }
          return true;
        });

        list.sort((a, b) => {
          switch (state.sort) {
            case "rating":
              return (b.rating || 0) - (a.rating || 0);
            case "year":
              return (b.year || 0) - (a.year || 0);
            case "title":
              return String(a.title || "").localeCompare(String(b.title || ""));
            case "popular":
            default:
              return (b.popularity || 0) - (a.popularity || 0);
          }
        });

        return list;
      }

      function renderGrid() {
        const list = getFilteredItems();

        if (state.view === "watchlist") {
          els.sectionTitle.textContent = "My Watchlist";
          els.loadMoreWrap.style.display = "none";
        } else {
          els.sectionTitle.textContent = state.query.trim() ? `Results for "${state.query.trim()}"` : "Trending Now";
          const canLoadMore = hasTmdbSource() && state.page < state.totalPages;
          els.loadMoreWrap.style.display = canLoadMore ? "flex" : "none";
          els.loadMoreBtn.disabled = state.isLoadingPage;
          els.loadMoreBtn.textContent = state.isLoadingPage ? "Loading..." : `Load More Titles (Page ${state.page + 1})`;
        }

        els.resultMeta.textContent = `${list.length} ${list.length === 1 ? "title" : "titles"}`;

        if (!list.length) {
          els.movieGrid.innerHTML = `
            <div class="empty-state" style="grid-column: 1 / -1;">
              <h3>No titles to display</h3>
              <p>${
                state.view === "watchlist"
                  ? "Your watchlist is empty or no saved titles match your filter."
                  : "No matching titles found for this filter."
              }</p>
              <button class="primary-btn" style="padding: 10px 18px;" id="resetBtn" type="button">Reset Filters</button>
            </div>
          `;
          const resetBtn = document.getElementById("resetBtn");
          if (resetBtn) {
            resetBtn.addEventListener("click", () => {
              state.query = "";
              state.mediaType = "all";
              state.genre = "all";
              els.searchInput.value = "";
              syncTypeChips();
              renderGenreChips();
              fetchCatalogPage(1, false);
            });
          }
          return;
        }

        els.movieGrid.innerHTML = list
          .map((item) => {
            const poster = getPosterUrl(item);
            const fallback = getFallbackPoster(item);
            const saved = isSaved(item.id);
            const typeLabel = item.media_type === "tv" ? "Series" : "Movie";
            return `
              <article class="card">
                <div class="poster-box" data-open="${escapeAttr(item.id)}">
                  <img
                    src="${poster}"
                    alt="${escapeAttr(item.title)} poster"
                    loading="lazy"
                    onerror="if(this.src!==this.dataset.fb){this.src=this.dataset.fb;}"
                    data-fb="${escapeAttr(fallback)}"
                  />
                  <span class="rating-pill">★ ${Number(item.rating || 7.5).toFixed(1)}</span>
                  <button
                    class="save-btn ${saved ? "saved" : ""}"
                    data-save="${escapeAttr(item.id)}"
                    type="button"
                    title="${saved ? "Remove from watchlist" : "Add to watchlist"}"
                    aria-label="${saved ? "Remove from watchlist" : "Add to watchlist"}"
                  >${saved ? "✓" : "+"}</button>
                </div>
                <div class="card-body" data-open="${escapeAttr(item.id)}">
                  <h3 class="card-title">${escapeHtml(item.title)}</h3>
                  <div class="card-sub">
                    <span>${item.year || "—"}</span>
                    <span class="type-badge">${typeLabel}</span>
                  </div>
                </div>
              </article>
            `;
          })
          .join("");

        els.movieGrid.querySelectorAll("[data-open]").forEach((el) => {
          el.addEventListener("click", () => {
            const found = findItemById(el.getAttribute("data-open"));
            if (found) openDetailModal(found);
          });
        });

        els.movieGrid.querySelectorAll("[data-save]").forEach((btn) => {
          btn.addEventListener("click", (e) => {
            e.stopPropagation();
            const found = findItemById(btn.getAttribute("data-save"));
            if (found) toggleWatchlist(found);
          });
        });
      }

      function renderModalBody(item) {
        const poster = getPosterUrl(item);
        const fallback = getFallbackPoster(item);
        const saved = isSaved(item.id);
        const similar = state.items.filter((x) => x.id !== item.id).slice(0, 4);
        const providers = Array.isArray(item.providers) ? item.providers : [];
        const cast = Array.isArray(item.cast) ? item.cast : [];
        const ytSearchUrl = buildYouTubeSearchUrl(item);

        const trailerHtml = item.trailerKey
          ? `<div class="trailer-box"><iframe src="https://www.youtube-nocookie.com/embed/${encodeURIComponent(item.trailerKey)}" title="${escapeAttr(item.title)} trailer" allowfullscreen></iframe></div>`
          : `<div class="info-note">
               <span>Direct embed trailer not listed for this title—search YouTube for the official trailer.</span>
               <a class="yt-fallback-btn" href="${escapeAttr(ytSearchUrl)}" target="_blank" rel="noopener noreferrer">Search on YouTube ↗</a>
             </div>`;

        const providersHtml = providers.length
          ? `<div class="provider-list">${providers.map(renderProviderPill).join("")}</div>`
          : `<div class="info-note">Streaming availability not listed for this region.</div>`;

        const castHtml = cast.length
          ? `<div class="cast-list">${cast.map((c) => `<span class="cast-pill">${escapeHtml(c)}</span>`).join("")}</div>`
          : `<div class="info-note">Cast list not available.</div>`;

        els.detailContent.innerHTML = `
          <div class="modal-hero">
            <img
              class="modal-poster"
              src="${poster}"
              alt="${escapeAttr(item.title)} poster"
              onerror="if(this.src!==this.dataset.fb){this.src=this.dataset.fb;}"
              data-fb="${escapeAttr(fallback)}"
            />
            <div>
              <h2 class="modal-title" id="modalTitle">${escapeHtml(item.title)}</h2>
              <div class="modal-meta">
                <span>★ ${Number(item.rating || 7.5).toFixed(1)}</span>
                <span>${item.year || "—"}</span>
                <span>${escapeHtml(item.runtime || "Feature")}</span>
                <span>${escapeHtml((item.genreLabels || []).join(", "))}</span>
              </div>
              <p class="modal-overview">${escapeHtml(item.overview || "Synopsis not available.")}</p>
              <button class="primary-btn" style="padding: 10px 18px;" id="modalWlBtn" type="button">
                ${saved ? "✓ In Watchlist" : "+ Add to Watchlist"}
              </button>
            </div>
          </div>

          <div class="modal-section">
            <h3>Trailer</h3>
            ${trailerHtml}
          </div>

          <div class="modal-section">
            <h3>Where to Watch</h3>
            ${providersHtml}
          </div>

          <div class="modal-section">
            <h3>Cast</h3>
            ${castHtml}
          </div>

          <div class="modal-section">
            <h3>More Titles</h3>
            <div class="similar-grid">
              ${similar
                .map(
                  (s) => `
                <button class="similar-card" data-sim="${escapeAttr(s.id)}" type="button">
                  <img
                    src="${getPosterUrl(s)}"
                    alt="${escapeAttr(s.title)}"
                    loading="lazy"
                    onerror="if(this.src!==this.dataset.fb){this.src=this.dataset.fb;}"
                    data-fb="${escapeAttr(getFallbackPoster(s))}"
                  />
                  <p>${escapeHtml(s.title)}</p>
                </button>
              `
                )
                .join("")}
            </div>
          </div>
        `;

        const wlBtn = document.getElementById("modalWlBtn");
        if (wlBtn) {
          wlBtn.addEventListener("click", () => {
            toggleWatchlist(item);
            renderModalBody(item);
          });
        }

        els.detailContent.querySelectorAll("[data-sim]").forEach((btn) => {
          btn.addEventListener("click", () => {
            const nextItem = findItemById(btn.getAttribute("data-sim"));
            if (nextItem) openDetailModal(nextItem);
          });
        });
      }

      async function openDetailModal(item) {
        renderModalBody(item);
        els.detailModal.classList.add("open");
        const enriched = await enrichTitleDetails(item);
        if (els.detailModal.classList.contains("open")) {
          renderModalBody(enriched);
        }
      }

      function closeDetailModal() {
        els.detailModal.classList.remove("open");
        els.detailContent.innerHTML = "";
      }

      function syncTypeChips() {
        els.typeChips.querySelectorAll(".chip").forEach((btn) => {
          btn.classList.toggle("active", btn.getAttribute("data-type") === state.mediaType);
        });
      }

      function escapeHtml(str) {
        return String(str || "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      function escapeAttr(str) {
        return escapeHtml(str).replace(/'/g, "&#39;");
      }

      // Event listeners
      els.catalogTabBtn.addEventListener("click", () => {
        state.view = "explore";
        els.catalogTabBtn.classList.add("active");
        els.watchlistTabBtn.classList.remove("active");
        renderGrid();
      });

      els.watchlistTabBtn.addEventListener("click", () => {
        state.view = "watchlist";
        els.watchlistTabBtn.classList.add("active");
        els.catalogTabBtn.classList.remove("active");
        renderGrid();
      });

      els.homeLink.addEventListener("click", (e) => {
        e.preventDefault();
        state.view = "explore";
        state.query = "";
        state.mediaType = "all";
        state.genre = "all";
        state.sort = "popular";
        els.searchInput.value = "";
        els.sortSelect.value = "popular";
        els.catalogTabBtn.classList.add("active");
        els.watchlistTabBtn.classList.remove("active");
        syncTypeChips();
        renderGenreChips();
        fetchCatalogPage(1, false);
      });

      let debounceTimer = null;
      els.searchInput.addEventListener("input", () => {
        clearTimeout(debounceTimer);
        debounceTimer = setTimeout(() => {
          state.query = els.searchInput.value;
          if (hasTmdbSource()) {
            fetchCatalogPage(1, false);
          } else {
            renderGrid();
          }
        }, 250);
      });

      els.searchForm.addEventListener("submit", (e) => {
        e.preventDefault();
        state.query = els.searchInput.value;
        if (hasTmdbSource()) {
          fetchCatalogPage(1, false);
        } else {
          renderGrid();
        }
      });

      els.clearSearchBtn.addEventListener("click", () => {
        els.searchInput.value = "";
        state.query = "";
        if (hasTmdbSource()) {
          fetchCatalogPage(1, false);
        } else {
          renderGrid();
        }
      });

      els.typeChips.querySelectorAll(".chip").forEach((btn) => {
        btn.addEventListener("click", () => {
          state.mediaType = btn.getAttribute("data-type") || "all";
          syncTypeChips();
          if (hasTmdbSource() && state.view === "explore") {
            fetchCatalogPage(1, false);
          } else {
            renderGrid();
          }
        });
      });

      els.sortSelect.addEventListener("change", () => {
        state.sort = els.sortSelect.value;
        renderGrid();
      });

      els.loadMoreBtn.addEventListener("click", () => {
        if (!state.isLoadingPage && state.page < state.totalPages) {
          fetchCatalogPage(state.page + 1, true);
        }
      });

      els.closeDetailModal.addEventListener("click", closeDetailModal);
      els.detailModal.addEventListener("click", (e) => {
        if (e.target === els.detailModal) closeDetailModal();
      });
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") closeDetailModal();
      });

      // Boot
      mountAdBanner();
      updateWatchlistBadge();
      renderGenreChips();
      renderGrid();
      fetchCatalogPage(1, false);
    })();
  </script>
</body>
</html>
