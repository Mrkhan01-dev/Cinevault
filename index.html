<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CineVault — Movies, Shows, Anime &amp; Where to Watch</title>
  <meta name="description" content="Browse trending movies, TV shows, anime, and upcoming releases on CineVault. Discover genres, trailers, cast, and where to watch." />
  <link rel="canonical" href="https://cinevault.space/" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/favicon.svg" />
  <style>
    :root {
      --bg: #050608;
      --bg-elevated: #0c0f16;
      --surface: #131722;
      --surface-2: #1b2130;
      --surface-3: #252d40;
      --text: #f6f8fc;
      --muted: #a4afc6;
      --accent: #e50914;
      --accent-2: #ff1e2d;
      --gold: #f5c518;
      --border: rgba(255, 255, 255, 0.09);
      --border-strong: rgba(255, 255, 255, 0.22);
      --radius: 10px;
      --shadow: 0 20px 44px rgba(0, 0, 0, 0.72);
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
      --max: 1360px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }

    html, body {
      background:
        radial-gradient(ellipse at top center, rgba(229, 9, 20, 0.16) 0%, rgba(16, 22, 38, 0.44) 36%, var(--bg) 76%);
      background-color: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    a { color: inherit; text-decoration: none; }
    button, input, select { font-family: inherit; color: inherit; }
    button { cursor: pointer; border: none; background: none; }

    /* Header */
    header {
      position: sticky;
      top: 0;
      z-index: 40;
      backdrop-filter: blur(16px);
      background: linear-gradient(180deg, rgba(5, 6, 8, 0.96) 0%, rgba(5, 6, 8, 0.84) 100%);
      border-bottom: 1px solid rgba(255, 255, 255, 0.07);
    }

    .nav-wrap {
      max-width: var(--max);
      margin: 0 auto;
      padding: 12px 20px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 900;
      font-size: 1.32rem;
      letter-spacing: 0.03em;
      text-transform: uppercase;
    }

    .brand-mark {
      color: var(--accent);
      font-size: 1.45rem;
      line-height: 1;
      text-shadow: 0 0 20px rgba(229, 9, 20, 0.65);
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .pill-btn {
      padding: 7px 13px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border);
      font-size: 0.84rem;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background 0.18s var(--ease), border-color 0.18s var(--ease);
    }

    .pill-btn:hover {
      background: rgba(255, 255, 255, 0.16);
      border-color: var(--border-strong);
    }

    .pill-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
      box-shadow: 0 6px 18px rgba(229, 9, 20, 0.35);
    }

    .nav-select {
      padding: 7px 12px;
      border-radius: 999px;
      background: var(--surface-2);
      border: 1px solid var(--border-strong);
      font-size: 0.84rem;
      font-weight: 700;
      outline: none;
    }

    .count-tag {
      background: rgba(255, 255, 255, 0.22);
      padding: 1px 7px;
      border-radius: 999px;
      font-size: 0.74rem;
      font-weight: 800;
    }

    /* Main */
    main {
      max-width: var(--max);
      margin: 0 auto;
      padding: 16px 20px 56px;
    }

    /* Spotlight Hero */
    .spotlight-strip {
      display: grid;
      grid-auto-flow: column;
      grid-auto-columns: 100%;
      gap: 16px;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      scroll-behavior: smooth;
      scrollbar-width: none;
      margin-bottom: 16px;
    }

    .spotlight-strip::-webkit-scrollbar { display: none; }

    .spot-slide {
      scroll-snap-align: center;
      position: relative;
      background-color: var(--bg-elevated);
      background-size: cover;
      background-position: center;
      border: 1px solid var(--border-strong);
      border-radius: 16px;
      padding: 22px;
      box-shadow: var(--shadow);
      display: grid;
      grid-template-columns: 1fr 176px;
      gap: 22px;
      align-items: center;
      overflow: hidden;
      min-height: 270px;
    }

    .spot-slide::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(95deg, rgba(5, 6, 8, 0.96) 0%, rgba(8, 11, 20, 0.86) 60%, rgba(5, 6, 8, 0.65) 100%),
        linear-gradient(180deg, rgba(5, 6, 8, 0.25) 0%, rgba(5, 6, 8, 0.94) 100%);
      z-index: 0;
    }

    .spot-body, .spot-poster-link { position: relative; z-index: 1; }
    .spot-body { min-width: 0; }

    .spot-badge-row {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 8px;
    }

    .spot-rank-big {
      background: var(--accent);
      color: #fff;
      font-size: 0.82rem;
      font-weight: 900;
      padding: 3px 10px;
      border-radius: 6px;
      letter-spacing: 0.03em;
    }

    .spot-soon-pill {
      background: rgba(245, 197, 24, 0.16);
      color: var(--gold);
      border: 1px solid rgba(245, 197, 24, 0.45);
      font-size: 0.76rem;
      font-weight: 800;
      padding: 3px 10px;
      border-radius: 6px;
    }

    .spot-slide h1, .spot-slide h2 {
      font-size: clamp(1.45rem, 3.2vw, 2.2rem);
      font-weight: 900;
      letter-spacing: -0.025em;
      line-height: 1.14;
    }

    .spot-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-top: 9px;
      font-size: 0.78rem;
      color: var(--muted);
    }

    .spot-tags span {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border);
      padding: 3px 9px;
      border-radius: 6px;
    }

    .spot-gold { color: var(--gold) !important; font-weight: 700; }

    .spot-desc {
      color: #dce3f2;
      font-size: 0.9rem;
      margin-top: 9px;
      margin-bottom: 12px;
      max-width: 650px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .spot-streams {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 7px;
      margin-bottom: 13px;
    }

    .spot-streams-label {
      font-size: 0.72rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--muted);
    }

    .stream-chip-link {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 10px;
      border-radius: 6px;
      background: rgba(229, 9, 20, 0.18);
      border: 1px solid rgba(229, 9, 20, 0.5);
      color: #fff;
      font-size: 0.75rem;
      font-weight: 700;
      white-space: nowrap;
    }

    .stream-chip-link:hover { background: var(--accent); border-color: var(--accent-2); }

    .spot-actions { display: flex; flex-wrap: wrap; gap: 9px; }

    .primary-btn {
      padding: 10px 18px;
      border-radius: 8px;
      background: var(--accent);
      color: #fff;
      font-weight: 700;
      font-size: 0.88rem;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
    }

    .primary-btn:hover { background: var(--accent-2); }

    .secondary-btn {
      padding: 10px 16px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.13);
      border: 1px solid var(--border-strong);
      color: var(--text);
      font-weight: 700;
      font-size: 0.86rem;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      gap: 7px;
    }

    .secondary-btn:hover { background: rgba(255, 255, 255, 0.22); }

    .spot-poster-link {
      display: block;
      width: 100%;
      max-width: 176px;
      aspect-ratio: 2 / 3;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border-strong);
      box-shadow: 0 18px 36px rgba(0, 0, 0, 0.78);
      background: var(--surface-2);
    }

    .spot-poster-link img { width: 100%; height: 100%; object-fit: cover; display: block; }

    /* Search & Filters */
    .search-section { margin-bottom: 12px; }
    .search-row { display: grid; grid-template-columns: 1fr auto; gap: 10px; }
    .search-input-wrap { position: relative; display: flex; align-items: center; }

    .search-input {
      width: 100%;
      padding: 10px 40px 10px 14px;
      border-radius: 8px;
      background: var(--surface);
      border: 1px solid var(--border-strong);
      font-size: 0.92rem;
      outline: none;
    }

    .search-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(229, 9, 20, 0.22);
    }

    .clear-btn {
      position: absolute;
      right: 8px;
      width: 28px;
      height: 28px;
      border-radius: 6px;
      color: var(--muted);
      display: grid;
      place-items: center;
    }

    .filters { display: flex; flex-direction: column; gap: 10px; margin-bottom: 18px; }
    .filter-row { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; }
    .chip-group { display: flex; flex-wrap: wrap; gap: 7px; }

    .chip {
      padding: 6px 13px;
      border-radius: 999px;
      background: var(--surface);
      border: 1px solid var(--border);
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--muted);
    }

    .chip:hover { color: var(--text); background: var(--surface-2); }
    .chip.active { background: var(--text); color: var(--bg); border-color: var(--text); }

    .sort-select {
      padding: 7px 12px;
      border-radius: 8px;
      background: var(--surface);
      border: 1px solid var(--border);
      font-size: 0.82rem;
      font-weight: 600;
    }

    /* Direct Streaming Panel */
    .watch-direct-panel {
      display: none;
      background: var(--surface);
      border: 1px solid var(--border-strong);
      border-radius: 14px;
      padding: 15px 18px;
      margin-bottom: 18px;
    }

    .watch-direct-panel.active { display: block; }
    .watch-direct-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 11px; }
    .watch-direct-title { font-size: 1rem; font-weight: 800; }
    .watch-direct-sub { font-size: 0.76rem; color: var(--muted); }
    .watch-platform-grid { display: flex; flex-wrap: wrap; gap: 9px; }

    .watch-platform-btn {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 8px 14px;
      border-radius: 8px;
      background: var(--surface-2);
      border: 1px solid var(--border-strong);
      font-size: 0.83rem;
      font-weight: 700;
    }

    .watch-platform-btn:hover { background: var(--accent); border-color: var(--accent-2); color: #fff; }
    .watch-mode-tag { font-size: 0.68rem; padding: 2px 6px; border-radius: 4px; background: rgba(255, 255, 255, 0.12); }

    /* Netflix Category Rows */
    .netflix-rows { display: flex; flex-direction: column; gap: 22px; margin-bottom: 24px; }

    .row-block {
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: rgba(19, 23, 34, 0.55);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
    }

    .row-header { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
    .row-title-wrap { display: flex; align-items: center; gap: 8px; }
    .row-title { font-size: 1.06rem; font-weight: 800; }
    .row-title-link:hover { color: #ff6b72; }
    .row-count { font-size: 0.74rem; color: var(--muted); font-weight: 700; background: var(--surface-2); padding: 2px 8px; border-radius: 999px; }
    .row-actions { display: flex; align-items: center; gap: 8px; }

    .row-hub-link, .row-expand-btn {
      padding: 5px 11px;
      border-radius: 6px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      font-size: 0.75rem;
      font-weight: 700;
    }

    .row-hub-link:hover, .row-expand-btn:hover { border-color: var(--border-strong); background: var(--surface-3); }

    .row-scroller {
      display: grid;
      grid-auto-flow: column;
      grid-auto-columns: minmax(144px, 166px);
      gap: 12px;
      overflow-x: auto;
      padding-bottom: 6px;
      scrollbar-width: thin;
      scrollbar-color: var(--surface-3) transparent;
      scroll-snap-type: x proximity;
    }

    .row-scroller.expanded {
      grid-auto-flow: row;
      grid-template-columns: repeat(auto-fill, minmax(156px, 1fr));
      overflow-x: visible;
    }

    .row-scroller > .card { scroll-snap-align: start; }

    /* Grid */
    .section-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 14px; gap: 12px; flex-wrap: wrap; }
    .section-title { font-size: 1.15rem; font-weight: 800; }
    .result-meta { font-size: 0.82rem; color: var(--muted); }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(166px, 1fr)); gap: 14px; }

    .card {
      background: var(--surface);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: var(--radius);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s var(--ease), border-color 0.2s var(--ease);
    }

    .card:hover { transform: translateY(-3px); border-color: rgba(229, 9, 20, 0.55); }
    .card-link-main { display: flex; flex-direction: column; flex: 1; }

    .poster-box { position: relative; aspect-ratio: 2 / 3; background: var(--surface-2); overflow: hidden; }
    .poster-box img { width: 100%; height: 100%; object-fit: cover; display: block; }

    .soon-badge {
      position: absolute;
      bottom: 8px;
      left: 8px;
      right: 8px;
      background: linear-gradient(135deg, var(--accent-2) 0%, #8e030a 100%);
      color: #fff;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 0.7rem;
      font-weight: 800;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .rank-badge-large {
      position: absolute;
      bottom: 8px;
      left: 8px;
      background: linear-gradient(135deg, var(--accent-2) 0%, #8e030a 100%);
      color: #fff;
      padding: 3px 9px;
      border-radius: 6px;
      font-size: 0.84rem;
      font-weight: 900;
    }

    .rating-pill {
      position: absolute;
      top: 8px;
      left: 8px;
      background: rgba(5, 6, 8, 0.88);
      border: 1px solid rgba(255, 255, 255, 0.14);
      padding: 2px 7px;
      border-radius: 6px;
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--gold);
    }

    .save-btn {
      position: absolute;
      top: 8px;
      right: 8px;
      z-index: 2;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: rgba(5, 6, 8, 0.88);
      border: 1px solid rgba(255, 255, 255, 0.18);
      display: grid;
      place-items: center;
      font-size: 0.86rem;
    }

    .save-btn:hover, .save-btn.saved { background: var(--accent); border-color: var(--accent); color: #fff; }

    .card-body { padding: 9px 10px 11px; display: flex; flex-direction: column; gap: 5px; flex: 1; }
    .card-title { font-size: 0.85rem; font-weight: 700; line-height: 1.25; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .card-streams { display: flex; flex-wrap: wrap; gap: 4px; }

    .mini-stream-link {
      font-size: 0.64rem;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.14);
      color: #e6ecf8;
      white-space: nowrap;
    }

    .mini-stream-link:hover { background: var(--accent); border-color: var(--accent); color: #fff; }

    .card-sub { font-size: 0.72rem; color: var(--muted); display: flex; align-items: center; justify-content: space-between; gap: 6px; margin-top: auto; }
    .type-badge { text-transform: uppercase; font-size: 0.62rem; font-weight: 800; padding: 2px 6px; border-radius: 4px; background: rgba(229, 9, 20, 0.16); color: #ff6b72; }

    /* SEO Interlink Directory Footer Block */
    .seo-hub-directory {
      margin-top: 28px;
      background: rgba(19, 23, 34, 0.55);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
    }

    .seo-hub-directory h2 { font-size: 1rem; font-weight: 800; margin-bottom: 10px; }
    .seo-hub-links { display: flex; flex-wrap: wrap; gap: 8px; }

    .seo-hub-link {
      padding: 6px 12px;
      border-radius: 7px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      font-size: 0.8rem;
      font-weight: 600;
      color: #dce3f2;
    }

    .seo-hub-link:hover { border-color: var(--accent); color: #fff; }

    /* Ad Slot */
    .ad-slot { margin: 20px auto; width: fit-content; max-width: 100%; display: flex; flex-direction: column; align-items: flex-end; gap: 3px; }
    .ad-corner-tag { font-size: 0.6rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); background: rgba(19, 23, 34, 0.92); border: 1px solid rgba(255, 255, 255, 0.1); padding: 2px 6px; border-radius: 4px; font-weight: 600; }
    .ad-box { border-radius: 8px; overflow: hidden; background: var(--surface); border: 1px solid rgba(255, 255, 255, 0.08); display: flex; align-items: center; justify-content: center; max-width: 100%; }
    .ad-box iframe { display: block; border: 0; max-width: 100%; }

    .empty-state { background: var(--surface); border: 1px dashed rgba(255, 255, 255, 0.18); border-radius: var(--radius); padding: 34px 20px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 12px; }
    .empty-state p { color: var(--muted); max-width: 440px; font-size: 0.9rem; }

    footer {
      max-width: var(--max);
      margin: 0 auto;
      padding: 20px 20px 30px;
      border-top: 1px solid var(--border);
      color: var(--muted);
      font-size: 0.82rem;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    @media (max-width: 720px) {
      .spot-slide { grid-template-columns: 100px minmax(0, 1fr); padding: 15px 14px; gap: 13px; min-height: 0; }
      .spot-poster-link { max-width: 100px; grid-column: 1; grid-row: 1; align-self: start; }
      .spot-body { grid-column: 2; grid-row: 1; }
      .spot-slide h1, .spot-slide h2 { font-size: 1.2rem; }
      .spot-desc { font-size: 0.8rem; margin-top: 6px; margin-bottom: 9px; }
      .primary-btn, .secondary-btn { padding: 8px 12px; font-size: 0.8rem; }
    }

    @media (max-width: 640px) {
      main { padding: 14px 14px 48px; }
      .search-row { grid-template-columns: 1fr; }
      .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
      .row-scroller { grid-auto-columns: minmax(132px, 148px); }
      .row-scroller.expanded { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
  </style>
</head>
<body>
  <header>
    <div class="nav-wrap">
      <a class="brand" href="#top" id="homeLink">
        <span class="brand-mark" aria-hidden="true">▶</span>
        <span>CineVault</span>
      </a>

      <nav class="nav-actions" aria-label="Primary Navigation">
        <button class="pill-btn active" id="exploreTabBtn" type="button">Home</button>
        <button class="pill-btn" id="showsTabBtn" type="button">Shows</button>
        <button class="pill-btn" id="moviesTabBtn" type="button">Movies</button>
        <a class="pill-btn" href="#row-coming-soon">Coming Soon</a>
        <select class="nav-select" id="navCategorySelect" aria-label="Jump to Category">
          <option value="all">Categories ▾</option>
          <option value="action">Action</option>
          <option value="anime">Anime</option>
          <option value="comedy">Comedy</option>
          <option value="crime">Crime</option>
          <option value="documentary">Documentaries</option>
          <option value="drama">Drama</option>
          <option value="fantasy">Fantasy</option>
          <option value="horror">Horror</option>
          <option value="kids">Kids &amp; Family</option>
          <option value="romance">Romance</option>
          <option value="scifi">Sci-Fi</option>
          <option value="sports">Sports</option>
          <option value="thriller">Thrillers</option>
        </select>
        <button class="pill-btn" id="watchlistTabBtn" type="button">
          My List <span class="count-tag" id="watchlistCount">0</span>
        </button>
      </nav>
    </div>
  </header>

  <main id="top">
    <section class="spotlight-strip" id="spotlightStrip" aria-label="Featured Spotlight Swipe Strip"></section>

    <section class="search-section" aria-label="Search Catalog">
      <form class="search-row" id="searchForm" role="search">
        <div class="search-input-wrap">
          <input
            class="search-input"
            id="searchInput"
            type="search"
            placeholder="Search movies, shows, anime, or genres..."
            autocomplete="off"
            aria-label="Search movies or shows"
          />

      function slugify(str) {
        return (
          String(str || "title")
            .toLowerCase()
            .normalize("NFKD")
            .replace(/[\u0300-\u036f]/g, "")
            .replace(/[^a-z0-9]+/g, "-")
            .replace(/^-+|-+$/g, "") || "title"
        );

      function getItemPageUrl(item) {
        const folder = item.media_type === "tv" ? "tv" : "movie";
        const idPart = item.tmdbId || item.id;
        return `/${folder}/${slugify(item.title)}-${idPart}.html`;
      }

      function getCategoryHubUrl(slug) {
        return `/category/${slug}.html`;
      }

      function getDirectPlatformUrl(providerName, title) {
        const clean = String(providerName || "").trim();
        const key = clean.toLowerCase();
        if (STREAM_DIRECT_URLS[key]) return STREAM_DIRECT_URLS[key];
        return `https://www.google.com/search?q=${encodeURIComponent(`watch ${title} on ${clean}`)}`;
      }

      function extractDirectPlatforms(watchResults, title) {
        if (!watchResults || typeof watchResults !== "object") return [];
        const found = new Map();
        for (const regionBlock of Object.values(watchResults)) {
          if (!regionBlock || typeof regionBlock !== "object") continue;
          const entries = [
            ...(regionBlock.flatrate || []).map((x) => ({ ...x, mode: "Stream" })),
            ...(regionBlock.free || []).map((x) => ({ ...x, mode: "Free" })),
            ...(regionBlock.ads || []).map((x) => ({ ...x, mode: "Ads" })),
            ...(regionBlock.rent || []).map((x) => ({ ...x, mode: "Rent" })),
            ...(regionBlock.buy || []).map((x) => ({ ...x, mode: "Buy" }))
          ];
          for (const p of entries) {
            const name = String(p.provider_name || "").trim();
            if (!name) continue;
            const key = name.toLowerCase();
            if (!found.has(key)) {
              found.set(key, { name, mode: p.mode || "Stream", url: getDirectPlatformUrl(name, title) });
            }
          }
        }
        return Array.from(found.values()).slice(0, 8);
      }

      function getFallbackStreamsForItem(item) {
        if (Array.isArray(item.streams) && item.streams.length) return item.streams;
        if (item.genres && item.genres.includes("anime")) {

        return d.toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric", timeZone: "UTC" });

        return url;

      function buildFittedAd(unit) {
        const scriptHtml = `<script>atOptions={'key':'${unit.key}','format':'iframe','height':${unit.height},'width':${unit.width},'params':{}};<\/script><script data-cfasync="false" src="${unit.src}"><\/script>`;
        const srcdoc = `<!DOCTYPE html><html><head><meta charset="utf-8"><style>html,body{margin:0;padding:0;width:${unit.width}px;height:${unit.height}px;background:transparent;overflow:hidden;display:flex;align-items:center;justify-content:center;}</style></head><body>${scriptHtml}</body></html>`;
        const iframe = document.createElement("iframe");
        iframe.width = String(unit.width);

        iframe.setAttribute("loading", "lazy");
        iframe.srcdoc = srcdoc;
        return iframe;
      }

      function hasTmdbSource() {
        return Boolean((API_PROXY_URL || "").trim() || (DIRECT_TMDB_V3_KEY || "").trim());
      }

      function buildTmdbUrl(endpoint, params = {}) {
        const cleanPath = endpoint.startsWith("/") ? endpoint : `/${endpoint}`;
        const proxy = (API_PROXY_URL || "").trim().replace(/\/+$/, "");
        const key = (DIRECT_TMDB_V3_KEY || "").trim();
        const query = new URLSearchParams();
        for (const [k, v] of Object.entries(params)) {
          if (v !== undefined && v !== null && v !== "") query.set(k, String(v));
        }
        if (proxy) return `${proxy}${cleanPath}${query.toString() ? `?${query.toString()}` : ""}`;
        query.set("api_key", key);
        return `https://api.themoviedb.org/3${cleanPath}?${query.toString()}`;
      }

      function mapTmdbResult(r, idx, forceType = "") {
        const title = r.title || r.name || "Untitled";
        const dateStr = r.release_date || r.first_air_date || "";
        const year = parseInt(dateStr.slice(0, 4), 10) || 2026;
        const isTv = forceType ? forceType === "tv" : r.media_type === "tv" || Boolean(r.name && !r.title);
        const genreIds = Array.isArray(r.genre_ids) ? r.genre_ids : [];
        const mappedKeys = [];
        const mappedLabels = [];
        for (const gid of genreIds) {
          const info = GENRE_MAP[gid];
          if (info) {
            if (!mappedKeys.includes(info.key)) mappedKeys.push(info.key);
            if (!mappedLabels.includes(info.label)) mappedLabels.push(info.label);
          }
        }
        if (!mappedLabels.length) mappedLabels.push(isTv ? "Show" : "Movie");
        const fb = FALLBACK_ITEMS[idx % FALLBACK_ITEMS.length];
        return {
          id: `tmdb-${isTv ? "tv" : "movie"}-${r.id}`,
          tmdbId: r.id,
          media_type: isTv ? "tv" : "movie",
          title,
          releaseDate: dateStr,
          year,
          rating: Number(r.vote_average || 0),
          popularity: Number(r.popularity || 50),
          poster_path: r.poster_path || "",
          backdrop_path: r.backdrop_path || "",
          genres: mappedKeys,
          genreLabels: mappedLabels,
          streams: [],
          accent: fb.accent,
          overview: r.overview || "Explore full details, trailer, cast, and streaming platforms."
        };
      }

      async function hydrateStreamsForItems(items) {
        if (!hasTmdbSource() || !Array.isArray(items) || !items.length) return;
        const targets = items.filter((it) => it && it.tmdbId && (!it.streams || !it.streams.length)).slice(0, 10);
        await Promise.allSettled(
          targets.map(async (item) => {
            const folder = item.media_type === "tv" ? "tv" : "movie";
            const res = await fetch(buildTmdbUrl(`/${folder}/${item.tmdbId}/watch/providers`));
            if (!res.ok) return;
            const data = await res.json();
            const parsed = extractDirectPlatforms(data.results, item.title);
            if (parsed.length) item.streams = parsed;
          })
        );
      }

      async function loadNetflixCategories() {
        if (!hasTmdbSource()) {
          state.items = FALLBACK_ITEMS.slice();
          renderAll();
          return;
        }

        const q = state.query.trim();
        if (q) {
          try {
            const endpoint = state.mediaType === "movie" ? "/search/movie" : state.mediaType === "tv" ? "/search/tv" : "/search/multi";
            const res = await fetch(buildTmdbUrl(endpoint, { query: q, page: 1, include_adult: false }));
            if (res.ok) {
              const data = await res.json();
              state.items = (data.results || [])
                .filter((r) => r && r.media_type !== "person" && (r.title || r.name))
                .map((r, i) => mapTmdbResult(r, i, state.mediaType === "all" ? "" : state.mediaType));
              await hydrateStreamsForItems(state.items.slice(0, 6));
            }
          } catch {}
          renderAll();
          return;
        }

        try {
          const endpoints = [
            ["trending", "/trending/all/week", ""],
            ["comingSoon", "/movie/upcoming", "movie", { sort_by: "popularity.desc" }],
            ["shows", "/tv/popular", "tv"],
            ["anime", "/discover/tv", "tv", { with_genres: 16, with_original_language: "ja", sort_by: "popularity.desc" }],
            ["action", "/discover/movie", "movie", { with_genres: 28, sort_by: "popularity.desc" }],
            ["scifi", "/discover/movie", "movie", { with_genres: 878, sort_by: "popularity.desc" }],
            ["thriller", "/discover/movie", "movie", { with_genres: 53, sort_by: "popularity.desc" }],
            ["crime", "/discover/tv", "tv", { with_genres: 80, sort_by: "popularity.desc" }],
            ["drama", "/discover/movie", "movie", { with_genres: 18, sort_by: "popularity.desc" }],
            ["comedy", "/discover/movie", "movie", { with_genres: 35, sort_by: "popularity.desc" }],
            ["horror", "/discover/movie", "movie", { with_genres: 27, sort_by: "popularity.desc" }],
            ["documentary", "/discover/movie", "movie", { with_genres: 99, sort_by: "popularity.desc" }]
          ];

          const settled = await Promise.allSettled(
            endpoints.map(([, path, , extra]) => fetch(buildTmdbUrl(path, { page: 1, ...(extra || {}) })))
          );

          const nextRows = {};
          for (let i = 0; i < endpoints.length; i++) {
            const [key, , forceType] = endpoints[i];
            const res = settled[i];
            if (res.status === "fulfilled" && res.value.ok) {
              const json = await res.value.json();
              nextRows[key] = (json.results || [])
                .filter((r) => r && r.media_type !== "person" && (r.title || r.name))
                .map((r, idx) => mapTmdbResult(r, idx, forceType));
            } else {
              nextRows[key] = [];
            }
          }

          // Ensure major upcoming titles like Avengers: Doomsday appear in Coming Soon if present or needed
          const doomsdaySearch = await fetch(buildTmdbUrl("/search/movie", { query: "Avengers Doomsday", page: 1 }));
          if (doomsdaySearch.ok) {
            const ddData = await doomsdaySearch.json();
            const ddItems = (ddData.results || []).slice(0, 2).map((r, i) => mapTmdbResult(r, i, "movie"));
            const existingIds = new Set((nextRows.comingSoon || []).map((x) => x.id));
            const mergedSoon = [...ddItems.filter((x) => !existingIds.has(x.id)), ...(nextRows.comingSoon || [])];
            nextRows.comingSoon = mergedSoon;
          }

          state.rows = nextRows;
          state.items = nextRows.trending && nextRows.trending.length ? nextRows.trending : FALLBACK_ITEMS.slice();
          await hydrateStreamsForItems(state.items.slice(0, 5));
        } catch {
          state.items = FALLBACK_ITEMS.slice();
        }

        renderAll();
      }

      async function openDirectStreamPanel(item) {
        if (!item) return;
        state.activeStreamItem = item;
        renderDirectStreamPanel();
        els.watchDirectPanel.scrollIntoView({ behavior: "smooth", block: "nearest" });

        if (hasTmdbSource() && item.tmdbId && (!item.streams || !item.streams.length)) {
          try {
            const folder = item.media_type === "tv" ? "tv" : "movie";
            const res = await fetch(buildTmdbUrl(`/${folder}/${item.tmdbId}/watch/providers`));
            if (res.ok) {
              const data = await res.json();
              const parsed = extractDirectPlatforms(data.results, item.title);
              if (parsed.length) {
                item.streams = parsed;
                renderDirectStreamPanel();
              }
            }
          } catch {}
        }
      }

      function renderDirectStreamPanel() {
        const item = state.activeStreamItem;
        if (!item) {
          els.watchDirectPanel.classList.remove("active");
          els.watchDirectPanel.innerHTML = "";
          return;
        }
        const platforms = getFallbackStreamsForItem(item);
        els.watchDirectPanel.classList.add("active");
        els.watchDirectPanel.innerHTML = `
          <div class="watch-direct-head">
            <div>
              <h2 class="watch-direct-title">Where to Watch: ${escapeHtml(item.title)} (${item.year || ""})</h2>
              <p class="watch-direct-sub">Direct streaming platforms from TMDB provider data.</p>
            </div>
            <button class="pill-btn" id="closeStreamPanelBtn" type="button">Close ✕</button>
          </div>
          <div class="watch-platform-grid">
            ${platforms.map((p) => `<a class="watch-platform-btn" href="${escapeAttr(p.url)}" target="_blank" rel="noopener noreferrer sponsored"><span>${escapeHtml(p.name)}</span>${p.mode ? `<span class="watch-mode-tag">${escapeHtml(p.mode)}</span>` : ""}<span>↗</span></a>`).join("")}
          </div>
        `;
        const closeBtn = document.getElementById("closeStreamPanelBtn");
        if (closeBtn) closeBtn.addEventListener("click", () => { state.activeStreamItem = null; renderDirectStreamPanel(); });
      }

      function isSaved(id) { return state.watchlist.some((x) => x.id === id); }
      function updateWatchlistBadge() { els.watchlistCount.textContent = String(state.watchlist.length); }

      function toggleWatchlist(item) {
        if (!item || !item.id) return;
        state.watchlist = isSaved(item.id) ? state.watchlist.filter((x) => x.id !== item.id) : [item, ...state.watchlist];
        saveWatchlist(state.watchlist);
        updateWatchlistBadge();
        renderAll();
      }

      function findItemById(id) {
        for (const list of Object.values(state.rows)) {
          if (Array.isArray(list)) {
            const hit = list.find((x) => x.id === id);
            if (hit) return hit;
          }
        }
        return state.items.find((x) => x.id === id) || state.watchlist.find((x) => x.id === id) || FALLBACK_ITEMS[0];
      }

      function renderSpotlightStrip() {
        const pool = state.items.length ? state.items : FALLBACK_ITEMS;
        const featured = pool.slice(0, Math.min(pool.length, 6));
        els.spotlightStrip.innerHTML = featured.map((item, idx) => {
          const typeLabel = item.media_type === "tv" ? "Show" : "Movie";
          const saved = isSaved(item.id);
          const poster = getPosterUrl(item);
          const fallback = getFallbackPoster(item);
          const backdrop = getBackdropUrl(item);
          const href = getItemPageUrl(item);
          const soon = isComingSoon(item.releaseDate);
          const headingTag = idx === 0 ? "h1" : "h2";
          const directStreams = getFallbackStreamsForItem(item).slice(0, 4);

          return `
            <article class="spot-slide" style="background-image: url('${escapeAttr(backdrop)}');">
              <div class="spot-body">
                <div class="spot-badge-row">
                  <span class="spot-rank-big">#${idx + 1} TRENDING</span>
                  ${soon ? `<span class="spot-soon-pill">Coming Soon • ${escapeHtml(formatPrettyDate(item.releaseDate))}</span>` : ""}
                </div>
                <${headingTag}><a href="${escapeAttr(href)}">${escapeHtml(item.title)}</a></${headingTag}>
                <div class="spot-tags">
                  ${!soon && item.rating > 0 ? `<span class="spot-gold">★ ${Number(item.rating).toFixed(1)}</span>` : ""}
                  <span>${soon ? `Release: ${escapeHtml(formatPrettyDate(item.releaseDate))}` : item.year || "—"}</span>
                  <span>${escapeHtml(typeLabel)}</span>
                  <span>${escapeHtml((item.genreLabels || []).slice(0, 2).join(" • ") || "Featured")}</span>
                </div>
                <p class="spot-desc">${escapeHtml(item.overview || "")}</p>
                <div class="spot-streams">
                  <span class="spot-streams-label">Where to Watch:</span>
                  ${directStreams.map((s) => `<a class="stream-chip-link" href="${escapeAttr(s.url)}" target="_blank" rel="noopener noreferrer sponsored">${escapeHtml(s.name)} ↗</a>`).join("")}
                </div>
                <div class="spot-actions">
                  <a class="primary-btn" href="${escapeAttr(href)}">▶ Open Page</a>
                  <button class="secondary-btn" data-spot-watch="${escapeAttr(item.id)}" type="button">Where to Watch</button>
                  <button class="secondary-btn" data-spot-save="${escapeAttr(item.id)}" type="button">${saved ? "✓ In My List" : "+ My List"}</button>
                </div>
              </div>
              <a class="spot-poster-link" href="${escapeAttr(href)}" title="${escapeAttr(item.title)}">
                <img src="${poster}" alt="${escapeAttr(item.title)} poster" loading="eager" onerror="if(this.src!==this.dataset.fb){this.src=this.dataset.fb;}" data-fb="${escapeAttr(fallback)}" />
              </a>
            </article>
          `;
        }).join("");

        els.spotlightStrip.querySelectorAll("[data-spot-save]").forEach((btn) => {
          btn.addEventListener("click", (e) => { e.preventDefault(); e.stopPropagation(); toggleWatchlist(findItemById(btn.getAttribute("data-spot-save"))); });
        });
        els.spotlightStrip.querySelectorAll("[data-spot-watch]").forEach((btn) => {
          btn.addEventListener("click", (e) => { e.preventDefault(); e.stopPropagation(); openDirectStreamPanel(findItemById(btn.getAttribute("data-spot-watch"))); });
        });
      }

      function renderCardHtml(item, rankNum = 0) {
        const poster = getPosterUrl(item);
        const fallback = getFallbackPoster(item);
        const saved = isSaved(item.id);
        const typeLabel = item.media_type === "tv" ? "Show" : "Movie";
        const href = getItemPageUrl(item);
        const soon = isComingSoon(item.releaseDate);
        const streams = getFallbackStreamsForItem(item).slice(0, 2);

        const bottomBadge = soon
          ? `<span class="soon-badge">Coming Soon • ${escapeHtml(formatPrettyDate(item.releaseDate))}</span>`
          : rankNum > 0
          ? `<span class="rank-badge-large">#${rankNum}</span>`
          : "";

        return `
          <article class="card">
            <a class="card-link-main" href="${escapeAttr(href)}">
              <div class="poster-box">
                <img src="${poster}" alt="${escapeAttr(item.title)} (${typeLabel}, ${item.year || "2026"}) poster" loading="lazy" onerror="if(this.src!==this.dataset.fb){this.src=this.dataset.fb;}" data-fb="${escapeAttr(fallback)}" />
                ${!soon && item.rating > 0 ? `<span class="rating-pill">★ ${Number(item.rating).toFixed(1)}</span>` : ""}
                ${bottomBadge}
              </div>
              <div class="card-body">
                <h3 class="card-title">${escapeHtml(item.title)}</h3>
                <div class="card-streams">
                  ${streams.map((s) => `<a class="mini-stream-link" href="${escapeAttr(s.url)}" target="_blank" rel="noopener noreferrer sponsored">${escapeHtml(s.name)} ↗</a>`).join("")}
                </div>
                <div class="card-sub">
                  <span>${escapeHtml(soon ? `Coming Soon • ${formatPrettyDate(item.releaseDate)}` : String(item.year || "—"))}</span>
                  <span class="type-badge">${typeLabel}</span>
                </div>
              </div>
            </a>
            <button class="save-btn ${saved ? "saved" : ""}" data-save="${escapeAttr(item.id)}" type="button" title="${saved ? "Remove from list" : "Add to list"}" aria-label="Toggle list">${saved ? "✓" : "+"}</button>
          </article>
        `;
      }

      function bindSaveButtons(container) {
        if (!container) return;
        container.querySelectorAll("[data-save]").forEach((btn) => {
          btn.addEventListener("click", (e) => { e.preventDefault(); e.stopPropagation(); toggleWatchlist(findItemById(btn.getAttribute("data-save"))); });
        });
      }

      function hasActiveFilter() {
        return state.view !== "explore" || Boolean(state.query.trim()) || state.mediaType !== "all" || state.genre !== "all" || state.sort !== "popular";
      }

      function renderNetflixRows() {
        if (hasActiveFilter()) {
          els.netflixRowsSection.style.display = "none";
          els.netflixRowsSection.innerHTML = "";
          return;
        }

        const defs = [
          { id: "row-trending", trackId: "track-trending", title: "Trending Now", hubSlug: "trending", items: state.rows.trending, ranked: true },
          { id: "row-coming-soon", trackId: "track-coming-soon", title: "Coming Soon & Most Anticipated", hubSlug: "coming-soon", items: state.rows.comingSoon, ranked: false },
          { id: "row-shows", trackId: "track-shows", title: "Popular Shows", hubSlug: "shows", items: state.rows.shows, ranked: false },
          { id: "row-anime", trackId: "track-anime", title: "Anime", hubSlug: "anime", items: state.rows.anime, ranked: false },
          { id: "row-action", trackId: "track-action", title: "Action", hubSlug: "action", items: state.rows.action, ranked: false },
          { id: "row-scifi", trackId: "track-scifi", title: "Sci-Fi & Fantasy", hubSlug: "sci-fi", items: state.rows.scifi, ranked: false },
          { id: "row-thriller", trackId: "track-thriller", title: "Thrillers", hubSlug: "thrillers", items: state.rows.thriller, ranked: false },
          { id: "row-crime", trackId: "track-crime", title: "Crime Series", hubSlug: "crime", items: state.rows.crime, ranked: false },
          { id: "row-drama", trackId: "track-drama", title: "Drama", hubSlug: "drama", items: state.rows.drama, ranked: false },
          { id: "row-comedy", trackId: "track-comedy", title: "Comedy", hubSlug: "comedy", items: state.rows.comedy, ranked: false },
          { id: "row-horror", trackId: "track-horror", title: "Horror", hubSlug: "horror", items: state.rows.horror, ranked: false },
          { id: "row-documentary", trackId: "track-documentary", title: "Documentaries", hubSlug: "documentaries", items: state.rows.documentary, ranked: false }
        ].filter((r) => Array.isArray(r.items) && r.items.length > 0);

        els.netflixRowsSection.style.display = "flex";
        els.netflixRowsSection.innerHTML = defs.map((r) => `
          <div class="row-block" id="${escapeAttr(r.id)}">
            <div class="row-header">
              <div class="row-title-wrap">
                <h2 class="row-title"><a class="row-title-link" href="${escapeAttr(getCategoryHubUrl(r.hubSlug))}">${escapeHtml(r.title)}</a></h2>
                <span class="row-count">${r.items.length}</span>
              </div>
              <div class="row-actions">
                <a class="row-hub-link" href="${escapeAttr(getCategoryHubUrl(r.hubSlug))}">Category Page →</a>
                <button class="row-expand-btn" data-expand-track="${escapeAttr(r.trackId)}" type="button">Show All</button>
              </div>
            </div>
            <div class="row-scroller" id="${escapeAttr(r.trackId)}">
              ${r.items.map((it, i) => renderCardHtml(it, r.ranked && i < 10 ? i + 1 : 0)).join("")}
            </div>
          </div>
        `).join("");

        els.netflixRowsSection.querySelectorAll("[data-expand-track]").forEach((btn) => {
          btn.addEventListener("click", () => {
            const track = document.getElementById(btn.getAttribute("data-expand-track"));
            if (!track) return;
            const expanded = track.classList.toggle("expanded");
            btn.textContent = expanded ? "Collapse" : "Show All";
          });
        });

        bindSaveButtons(els.netflixRowsSection);
      }

      function getAllPool() {
        const merged = [...state.items, ...Object.values(state.rows).flat().filter(Boolean)];
        return Array.from(new Map(merged.map((x) => [x.id, x])).values());
      }

      function getFilteredItems() {
        const base = state.view === "watchlist" ? state.watchlist.slice() : getAllPool();
        const q = state.query.trim().toLowerCase();

        const list = base.filter((item) => {
          if (state.view === "shows" && item.media_type !== "tv") return false;
          if (state.view === "movies" && item.media_type !== "movie") return false;
          if (state.mediaType !== "all" && item.media_type !== state.mediaType) return false;
          if (state.genre !== "all") {
            const g = Array.isArray(item.genres) ? item.genres : [];
            if (!g.includes(state.genre)) return false;
          }
          if (q) {
            const hay = `${item.title || ""} ${item.overview || ""} ${(item.genreLabels || []).join(" ")}`.toLowerCase();
            if (!hay.includes(q)) return false;
          }
          return true;
        });

        list.sort((a, b) => {
          if (state.sort === "rating") return (b.rating || 0) - (a.rating || 0);
          if (state.sort === "year") return (b.year || 0) - (a.year || 0);
          if (state.sort === "title") return String(a.title || "").localeCompare(String(b.title || ""));
          return (b.popularity || 0) - (a.popularity || 0);
        });

        return list;
      }

      function renderFilteredGrid() {
        if (!hasActiveFilter()) {
          els.filteredSectionHead.style.display = "none";
          els.movieGrid.style.display = "none";
          els.movieGrid.innerHTML = "";
          return;
        }

        els.filteredSectionHead.style.display = "flex";
        els.movieGrid.style.display = "grid";

        const list = getFilteredItems();
        els.sectionTitle.textContent =
          state.view === "watchlist" ? "My List"
          : state.view === "shows" ? "TV Shows"
          : state.view === "movies" ? "Movies"
          : state.query.trim() ? `Search Results for "${state.query.trim()}"`
          : "Filtered Titles";
        els.resultMeta.textContent = `${list.length} ${list.length === 1 ? "title" : "titles"}`;

        if (!list.length) {
          els.movieGrid.innerHTML = `
            <div class="empty-state" style="grid-column: 1 / -1;">
              <h3>No titles found</h3>
              <p>Try another search term or clear your active filters.</p>
              <button class="primary-btn" id="resetBtn" type="button">Reset Filters</button>
            </div>
          `;
          const resetBtn = document.getElementById("resetBtn");
          if (resetBtn) resetBtn.addEventListener("click", resetAllFilters);
          return;
        }

        els.movieGrid.innerHTML = list.map((it) => renderCardHtml(it, 0)).join("");
        bindSaveButtons(els.movieGrid);
      }

      function renderGenreChips() {
        els.genreChips.innerHTML = CATEGORIES.map(
          (g) => `<button class="chip ${state.genre === g.id ? "active" : ""}" data-genre="${g.id}" type="button">${g.name}</button>`
        ).join("");
        els.genreChips.querySelectorAll(".chip").forEach((btn) => {
          btn.addEventListener("click", () => {
            state.genre = btn.getAttribute("data-genre") || "all";
            if (els.navCategorySelect) els.navCategorySelect.value = state.genre;
            renderAll();
          });
        });
      }

      function renderSeoHubLinks() {
        if (!els.seoHubLinks) return;
        const hubs = [
          { name: "Trending Now", slug: "trending" },
          { name: "Coming Soon", slug: "coming-soon" },
          { name: "Popular Shows", slug: "shows" },
          ...CATEGORIES.filter((c) => c.id !== "all")
        ];
        els.seoHubLinks.innerHTML = hubs.map((h) => `<a class="seo-hub-link" href="${escapeAttr(getCategoryHubUrl(h.slug))}">${escapeHtml(h.name)} →</a>`).join("");
      }

      function syncNavTabs() {
        els.exploreTabBtn.classList.toggle("active", state.view === "explore");
        els.showsTabBtn.classList.toggle("active", state.view === "shows");
        els.moviesTabBtn.classList.toggle("active", state.view === "movies");
        els.watchlistTabBtn.classList.toggle("active", state.view === "watchlist");
        els.typeChips.querySelectorAll(".chip").forEach((btn) => {
          btn.classList.toggle("active", btn.getAttribute("data-type") === state.mediaType);
        });
      }

      function resetAllFilters() {
        state.view = "explore";
        state.query = "";
        state.mediaType = "all";
        state.genre = "all";
        state.sort = "popular";
        state.activeStreamItem = null;
        els.searchInput.value = "";
        els.sortSelect.value = "popular";
        if (els.navCategorySelect) els.navCategorySelect.value = "all";
        syncNavTabs();
        renderDirectStreamPanel();
        loadNetflixCategories();
      }

      function renderAll() {
        syncNavTabs();
        renderGenreChips();
        renderSpotlightStrip();
        renderDirectStreamPanel();
        renderNetflixRows();
        renderFilteredGrid();
        renderSeoHubLinks();
      }

      function escapeHtml(str) {
        return String(str || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
      }

      function escapeAttr(str) { return escapeHtml(str).replace(/'/g, "&#39;"); }

      els.exploreTabBtn.addEventListener("click", () => { state.view = "explore"; state.mediaType = "all"; renderAll(); });
      els.showsTabBtn.addEventListener("click", () => { state.view = "shows"; state.mediaType = "tv"; renderAll(); });
      els.moviesTabBtn.addEventListener("click", () => { state.view = "movies"; state.mediaType = "movie"; renderAll(); });
      els.watchlistTabBtn.addEventListener("click", () => { state.view = "watchlist"; renderAll(); });
      if (els.navCategorySelect) {
        els.navCategorySelect.addEventListener("change", () => {
          state.genre = els.navCategorySelect.value || "all";
          renderAll();
        });
      }
      els.homeLink.addEventListener("click", (e) => { e.preventDefault(); if (els.spotlightStrip) els.spotlightStrip.scrollLeft = 0; resetAllFilters(); });

      let debounceTimer = null;
      els.searchInput.addEventListener("input", () => {
        clearTimeout(debounceTimer);
        debounceTimer = setTimeout(() => { state.query = els.searchInput.value; loadNetflixCategories(); }, 250);
      });
      els.searchForm.addEventListener("submit", (e) => { e.preventDefault(); state.query = els.searchInput.value; loadNetflixCategories(); });
      els.clearSearchBtn.addEventListener("click", () => { els.searchInput.value = ""; state.query = ""; loadNetflixCategories(); });

      els.typeChips.querySelectorAll(".chip").forEach((btn) => {
        btn.addEventListener("click", () => {
          state.mediaType = btn.getAttribute("data-type") || "all";
          if (state.mediaType === "tv") state.view = "shows";
          else if (state.mediaType === "movie") state.view = "movies";
          else if (state.view !== "watchlist") state.view = "explore";
          if (state.query.trim()) loadNetflixCategories();
          else renderAll();
        });
      });

      els.sortSelect.addEventListener("change", () => { state.sort = els.sortSelect.value; renderAll(); });

      mountAdBanner();
      updateWatchlistBadge();
      const urlQ = new URLSearchParams(window.location.search).get("q");
      if (urlQ) { state.query = urlQ; els.searchInput.value = urlQ; }
      renderAll();
      loadNetflixCategories();
    })();
  </script>
</body>
</html>
