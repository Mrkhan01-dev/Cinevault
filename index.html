<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CineVault — Movies, Shows, Anime &amp; Where to Watch</title>
  <meta name="description" content="Browse trending movies, TV shows, anime, and upcoming releases on CineVault. Discover genres, trailers, cast, and where to watch." />
  <link rel="canonical" href="https://cinevault.space/" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/favicon.svg" />
  <style>
    :root {
      --bg: #050608;
      --bg-elevated: #0c0f16;
      --surface: #131722;
      --surface-2: #1b2130;
      --surface-3: #252d40;
      --text: #f6f8fc;
      --muted: #a4afc6;
      --accent: #e50914;
      --accent-2: #ff1e2d;
      --gold: #f5c518;
      --border: rgba(255, 255, 255, 0.09);
      --border-strong: rgba(255, 255, 255, 0.22);
      --radius: 10px;
      --shadow: 0 20px 44px rgba(0, 0, 0, 0.72);
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
      --max: 1360px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }

    html, body {
      background:
        radial-gradient(ellipse at top center, rgba(229, 9, 20, 0.14) 0%, rgba(16, 22, 38, 0.42) 38%, var(--bg) 78%);
      background-color: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      line-height: 1.48;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    a { color: inherit; text-decoration: none; }
    button, input, select { font-family: inherit; color: inherit; }
    button { cursor: pointer; border: none; background: none; }

    /* Sticky Top Header */
    header {
      position: sticky;
      top: 0;
      z-index: 40;
      backdrop-filter: blur(16px);
      background: rgba(5, 6, 8, 0.94);
      border-bottom: 1px solid rgba(255, 255, 255, 0.07);
    }

    .nav-wrap {
      max-width: var(--max);
      margin: 0 auto;
      padding: 10px 16px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 900;
      font-size: 1.24rem;
      letter-spacing: 0.03em;
      text-transform: uppercase;
    }

    .brand-mark { color: var(--accent); font-size: 1.35rem; line-height: 1; }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .pill-btn {
      padding: 6px 12px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border);
      font-size: 0.78rem;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
    }

    .pill-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    .nav-select {
      padding: 6px 11px;
      border-radius: 999px;
      background: var(--surface-2);
      border: 1px solid var(--border-strong);
      font-size: 0.78rem;
      font-weight: 700;
      outline: none;
    }

    .count-tag {
      background: rgba(255, 255, 255, 0.22);
      padding: 1px 6px;
      border-radius: 999px;
      font-size: 0.7rem;
      font-weight: 800;
    }

    main {
      max-width: var(--max);
      margin: 0 auto;
      padding: 14px 16px 52px;
    }

    /* Clean Netflix-Style Feature Hero Card */
    .hero-feature-wrap {
      max-width: 440px;
      margin: 0 auto 18px;
    }

    .spotlight-strip {
      display: grid;
      grid-auto-flow: column;
      grid-auto-columns: 100%;
      gap: 14px;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      scroll-behavior: smooth;
      scrollbar-width: none;
    }

    .spotlight-strip::-webkit-scrollbar { display: none; }

    .hero-card {
      scroll-snap-align: center;
      background: var(--surface);
      border: 1px solid var(--border-strong);
      border-radius: 16px;
      padding: 12px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      gap: 11px;
    }

    .hero-poster-link {
      position: relative;
      display: block;
      width: 100%;
      aspect-ratio: 3 / 4;
      border-radius: 12px;
      overflow: hidden;
      background: var(--surface-2);
    }

    .hero-poster-link img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .hero-overlay-caption {
      position: absolute;
      inset: auto 0 0 0;
      padding: 28px 12px 12px;
      background: linear-gradient(180deg, rgba(5, 6, 8, 0) 0%, rgba(5, 6, 8, 0.92) 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 4px;
    }

    .hero-kicker {
      font-size: 0.72rem;
      font-weight: 800;
      color: #e4e9f5;
      letter-spacing: 0.02em;
    }

    .hero-rank-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--accent);
      color: #fff;
      font-size: 0.72rem;
      font-weight: 900;
      padding: 3px 8px;
      border-radius: 5px;
      letter-spacing: 0.04em;
    }

    .hero-title {
      font-size: 1.22rem;
      font-weight: 900;
      line-height: 1.18;
    }

    .hero-cta-stack {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .hero-primary-btn {
      width: 100%;
      padding: 10px 14px;
      border-radius: 8px;
      background: #ffffff;
      color: #050608;
      font-weight: 800;
      font-size: 0.88rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
    }

    .hero-primary-btn:hover { background: #e6eaf2; }

    .hero-secondary-btn {
      width: 100%;
      padding: 10px 14px;
      border-radius: 8px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--text);
      font-weight: 700;
      font-size: 0.86rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
    }

    .hero-secondary-btn:hover { background: var(--surface-3); }

    .hero-dots {
      display: flex;
      justify-content: center;
      gap: 6px;
      margin-top: 10px;
    }

    .hero-dot {
      width: 7px;
      height: 7px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.25);
    }

    .hero-dot.active {
      width: 20px;
      background: var(--accent);
    }

    /* Search & Filter Bar */
    .search-section { margin-bottom: 10px; }
    .search-row { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
    .search-input-wrap { position: relative; display: flex; align-items: center; }

    .search-input {
      width: 100%;
      padding: 9px 36px 9px 13px;
      border-radius: 8px;
      background: var(--surface);
      border: 1px solid var(--border-strong);
      font-size: 0.88rem;
      outline: none;
    }

    .clear-btn { position: absolute; right: 8px; width: 26px; height: 26px; border-radius: 6px; color: var(--muted); display: grid; place-items: center; }

    .primary-btn {
      padding: 9px 16px;
      border-radius: 8px;
      background: var(--accent);
      color: #fff;
      font-weight: 700;
      font-size: 0.84rem;
      white-space: nowrap;
    }

    .filters { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
    .filter-row { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
    .chip-group { display: flex; flex-wrap: wrap; gap: 6px; }

    .chip {
      padding: 5px 11px;
      border-radius: 999px;
      background: var(--surface);
      border: 1px solid var(--border);
      font-size: 0.76rem;
      font-weight: 600;
      color: var(--muted);
    }

    .chip.active { background: var(--text); color: var(--bg); border-color: var(--text); }

    .sort-select { padding: 6px 10px; border-radius: 8px; background: var(--surface); border: 1px solid var(--border); font-size: 0.78rem; font-weight: 600; }

    /* Clean Horizontal Shelves */
    .netflix-rows { display: flex; flex-direction: column; gap: 20px; margin-bottom: 22px; }

    .row-block { display: flex; flex-direction: column; gap: 10px; }

    .row-header { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
    .row-title-wrap { display: flex; align-items: center; gap: 8px; }
    .row-title { font-size: 1.04rem; font-weight: 800; letter-spacing: -0.01em; }
    .row-actions { display: flex; align-items: center; gap: 6px; }

    .row-hub-link, .row-expand-btn {
      padding: 4px 10px;
      border-radius: 6px;
      background: var(--surface);
      border: 1px solid var(--border);
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--muted);
    }

    .row-hub-link:hover, .row-expand-btn:hover { color: var(--text); border-color: var(--border-strong); }

    .row-scroller {
      display: grid;
      grid-auto-flow: column;
      grid-auto-columns: minmax(126px, 146px);
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: thin;
      scrollbar-color: var(--surface-3) transparent;
    }

    .row-scroller.expanded {
      grid-auto-flow: row;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      overflow-x: visible;
    }

    .section-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 12px; gap: 10px; flex-wrap: wrap; }
    .section-title { font-size: 1.1rem; font-weight: 800; }
    .result-meta { font-size: 0.8rem; color: var(--muted); }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(152px, 1fr)); gap: 12px; }

    /* Clean Card */
    .card {
      background: var(--surface);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: var(--radius);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .card-link-main { display: flex; flex-direction: column; flex: 1; min-width: 0; }

    .poster-box { position: relative; aspect-ratio: 2 / 3; background: var(--surface-2); overflow: hidden; }
    .poster-box img { width: 100%; height: 100%; object-fit: cover; display: block; }

    .soon-badge {
      position: absolute;
      bottom: 6px;
      left: 6px;
      right: 6px;
      background: var(--accent);
      color: #fff;
      padding: 3px 7px;
      border-radius: 5px;
      font-size: 0.65rem;
      font-weight: 800;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .rank-badge-large {
      position: absolute;
      bottom: 6px;
      left: 6px;
      background: var(--accent);
      color: #fff;
      padding: 2px 8px;
      border-radius: 5px;
      font-size: 0.78rem;
      font-weight: 900;
    }

    .rating-pill {
      position: absolute;
      top: 6px;
      left: 6px;
      background: rgba(5, 6, 8, 0.86);
      padding: 2px 6px;
      border-radius: 5px;
      font-size: 0.68rem;
      font-weight: 700;
      color: var(--gold);
    }

    .save-btn {
      position: absolute;
      top: 6px;
      right: 6px;
      z-index: 2;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: rgba(5, 6, 8, 0.86);
      border: 1px solid rgba(255, 255, 255, 0.18);
      display: grid;
      place-items: center;
      font-size: 0.82rem;
    }

    .save-btn.saved { background: var(--accent); border-color: var(--accent); color: #fff; }

    .card-body { padding: 8px 9px 9px; display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 0; }
    .card-title { font-size: 0.82rem; font-weight: 700; line-height: 1.24; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .card-sub { font-size: 0.7rem; color: var(--muted); display: flex; align-items: center; justify-content: space-between; gap: 4px; margin-top: auto; }
    .type-badge { text-transform: uppercase; font-size: 0.6rem; font-weight: 800; padding: 1px 5px; border-radius: 4px; background: rgba(255, 255, 255, 0.08); color: #dce3f2; }

    .seo-hub-directory { margin-top: 22px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px; }
    .seo-hub-directory h2 { font-size: 0.96rem; font-weight: 800; margin-bottom: 8px; }
    .seo-hub-links { display: flex; flex-wrap: wrap; gap: 6px; }
    .seo-hub-link { padding: 5px 10px; border-radius: 7px; background: var(--surface-2); border: 1px solid var(--border); font-size: 0.76rem; font-weight: 600; }

    .ad-slot { margin: 16px auto; width: fit-content; max-width: 100%; display: flex; flex-direction: column; align-items: flex-end; gap: 3px; }
    .ad-corner-tag { font-size: 0.58rem; text-transform: uppercase; color: var(--muted); background: rgba(19, 23, 34, 0.92); border: 1px solid rgba(255, 255, 255, 0.1); padding: 2px 6px; border-radius: 4px; }
    .ad-box { border-radius: 8px; overflow: hidden; background: var(--surface); border: 1px solid rgba(255, 255, 255, 0.08); display: flex; align-items: center; justify-content: center; max-width: 100%; }
    .ad-box iframe { display: block; border: 0; max-width: 100%; }

    footer { max-width: var(--max); margin: 0 auto; padding: 18px 16px 28px; border-top: 1px solid var(--border); color: var(--muted); font-size: 0.78rem; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; }

    @media (max-width: 640px) {
      main { padding: 12px 12px 44px; }
      .search-row { grid-template-columns: 1fr; }
      .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
      .row-scroller { grid-auto-columns: minmax(124px, 140px); }
      .row-scroller.expanded { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
  </style>
</head>
<body>
  <header>
    <div class="nav-wrap">
      <a class="brand" href="#top" id="homeLink">
        <span class="brand-mark" aria-hidden="true">▶</span>
        <span>CineVault</span>

      <nav class="nav-actions" aria-label="Primary Navigation">
        <button class="pill-btn active" id="exploreTabBtn" type="button">Home</button>

          My List <span class="count-tag" id="watchlistCount">0</span>
        </button>
      </nav>
    </div>
  </header>

  <main id="top">
    <section class="hero-feature-wrap" aria-label="Featured Title">
      <div class="spotlight-strip" id="spotlightStrip"></div>
      <div class="hero-dots" id="heroDots" aria-hidden="true"></div>
    </section>

    <section class="search-section" aria-label="Search Catalog">
      <form class="search-row" id="searchForm" role="search">
        <div class="search-input-wrap">
          <input class="search-input" id="searchInput" type="search" placeholder="Search movies, shows, anime, or genres..." autocomplete="off" aria-label="Search movies or shows" />

        </div>
        <button class="primary-btn" type="submit">Search</button>

    </section>

    <section class="filters" aria-label="Catalog Filters">
      <div class="filter-row">
        <div class="chip-group" id="typeChips">
          <button class="chip active" data-type="all" type="button">All</button>
          <button class="chip" data-type="movie" type="button">Movies</button>
          <button class="chip" data-type="tv" type="button">Shows</button>
        </div>
        <select class="sort-select" id="sortSelect" aria-label="Sort titles">
          <option value="popular">Sort: Popular</option>
          <option value="rating">Sort: Top Rated</option>
          <option value="year">Sort: Newest</option>
          <option value="title">Sort: Title (A–Z)</option>
        </select>
      </div>
      <div class="chip-group" id="genreChips"></div>
    </section>

    <div class="ad-slot" id="adSlotTop" aria-label="Sponsored">
      <span class="ad-corner-tag">Sponsored</span>
      <div class="ad-box" id="adBoxTop"></div>
    </div>

    <section class="netflix-rows" id="netflixRowsSection" aria-label="Netflix Categories"></section>

    <div class="section-head" id="filteredSectionHead">
      <h2 class="section-title" id="sectionTitle">Results</h2>
      <span class="result-meta" id="resultMeta"></span>
    </div>

    <section class="grid" id="movieGrid" aria-live="polite"></section>

    <section class="seo-hub-directory" aria-label="Browse All Categories & Hubs">
      <h2>Explore Category Hubs</h2>
      <div class="seo-hub-links" id="seoHubLinks"></div>
    </section>

    <div class="ad-slot" id="adSlotMid" aria-label="Sponsored">
      <span class="ad-corner-tag">Sponsored</span>
      <div class="ad-box" id="adBoxMid"></div>
    </div>
  </main>

  <footer>
    <span>CineVault • Movies, Shows, Anime &amp; Streaming Guide</span>
  </footer>

            .normalize("NFKD")

        const d = new Date(`${isoDate}T00:00:00Z`);
        if (Number.isNaN(d.getTime())) return isoDate;
        return d.toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric", timeZone: "UTC" });
      }

      const posterSvgCache = new Map();
      function getFallbackPoster(item) {
        const key = item.id || item.title;
        if (posterSvgCache.has(key)) return posterSvgCache.get(key);
        const [c1, c2] = item.accent || ["#e50914", "#181e2e"];
        const safeTitle = String(item.title || "CineVault").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="450" height="600" viewBox="0 0 450 600"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="${c1}"/><stop offset="100%" stop-color="${c2}"/></linearGradient></defs><rect width="450" height="600" fill="url(#g)"/><text x="225" y="300" text-anchor="middle" fill="#ffffff" font-family="system-ui,sans-serif" font-size="26" font-weight="800">${safeTitle.slice(0, 24)}</text></svg>`;
        const url = "data:image/svg+xml;charset=UTF-8," + encodeURIComponent(svg);
        posterSvgCache.set(key, url);
        return url;
      }

      function getPosterUrl(item) { return item.poster_path ? `${TMDB_POSTER_BASE}${item.poster_path}` : getFallbackPoster(item); }

      function loadWatchlist() {
        try {
          const parsed = JSON.parse(localStorage.getItem(WATCHLIST_KEY) || "[]");
          return Array.isArray(parsed) ? parsed : [];
        } catch { return []; }
      }

      function saveWatchlist(list) {
        try { localStorage.setItem(WATCHLIST_KEY, JSON.stringify(list)); } catch {}
      }

      const state = {
        view: "explore",
        query: "",
        mediaType: "all",
        genre: "all",
        sort: "popular",
        items: FALLBACK_ITEMS.slice(),
        rows: {},
        watchlist: loadWatchlist()
      };

      const els = {
        exploreTabBtn: document.getElementById("exploreTabBtn"),
        showsTabBtn: document.getElementById("showsTabBtn"),
        moviesTabBtn: document.getElementById("moviesTabBtn"),
        navCategorySelect: document.getElementById("navCategorySelect"),
        watchlistTabBtn: document.getElementById("watchlistTabBtn"),
        watchlistCount: document.getElementById("watchlistCount"),
        homeLink: document.getElementById("homeLink"),
        spotlightStrip: document.getElementById("spotlightStrip"),
        heroDots: document.getElementById("heroDots"),
        searchForm: document.getElementById("searchForm"),
        searchInput: document.getElementById("searchInput"),
        clearSearchBtn: document.getElementById("clearSearchBtn"),
        typeChips: document.getElementById("typeChips"),
        genreChips: document.getElementById("genreChips"),
        sortSelect: document.getElementById("sortSelect"),
        adBoxTop: document.getElementById("adBoxTop"),
        adBoxMid: document.getElementById("adBoxMid"),
        netflixRowsSection: document.getElementById("netflixRowsSection"),
        filteredSectionHead: document.getElementById("filteredSectionHead"),
        sectionTitle: document.getElementById("sectionTitle"),
        resultMeta: document.getElementById("resultMeta"),
        movieGrid: document.getElementById("movieGrid"),
        seoHubLinks: document.getElementById("seoHubLinks")
      };

      function buildFittedAd(unit) {
        const scriptHtml = `<script>atOptions={'key':'${unit.key}','format':'iframe','height':${unit.height},'width':${unit.width},'params':{}};<\/script><script data-cfasync="false" src="${unit.src}"><\/script>`;
        const srcdoc = `<!DOCTYPE html><html><head><meta charset="utf-8"><style>html,body{margin:0;padding:0;width:${unit.width}px;height:${unit.height}px;background:transparent;overflow:hidden;display:flex;align-items:center;justify-content:center;}</style></head><body>${scriptHtml}</body></html>`;
        const iframe = document.createElement("iframe");
        iframe.width = String(unit.width);
        iframe.height = String(unit.height);
        iframe.style.width = `${unit.width}px`;
        iframe.style.height = `${unit.height}px`;
        iframe.style.maxWidth = "100%";
        iframe.setAttribute("scrolling", "no");
        iframe.setAttribute("frameborder", "0");
        iframe.setAttribute("loading", "lazy");
        iframe.srcdoc = srcdoc;
        return iframe;
      }

      function mountAdBanner() {
        const isDesktop = window.matchMedia && window.matchMedia("(min-width: 780px)").matches;
        if (els.adBoxTop) {
          els.adBoxTop.innerHTML = "";
          const topUnit = isDesktop ? AD_UNITS.leader728x90 : AD_UNITS.banner300x250;
          els.adBoxTop.style.width = `${topUnit.width}px`;
          els.adBoxTop.style.height = `${topUnit.height}px`;
          els.adBoxTop.appendChild(buildFittedAd(topUnit));
        }
        if (els.adBoxMid) {
          els.adBoxMid.innerHTML = "";
          const midUnit = AD_UNITS.banner300x250;
          els.adBoxMid.style.width = `${midUnit.width}px`;
          els.adBoxMid.style.height = `${midUnit.height}px`;
          els.adBoxMid.appendChild(buildFittedAd(midUnit));
        }
      }

      function hasTmdbSource() { return Boolean((API_PROXY_URL || "").trim() || (DIRECT_TMDB_V3_KEY || "").trim()); }

      function buildTmdbUrl(endpoint, params = {}) {
        const cleanPath = endpoint.startsWith("/") ? endpoint : `/${endpoint}`;
        const proxy = (API_PROXY_URL || "").trim().replace(/\/+$/, "");
        const key = (DIRECT_TMDB_V3_KEY || "").trim();
        const query = new URLSearchParams();
        for (const [k, v] of Object.entries(params)) {
          if (v !== undefined && v !== null && v !== "") query.set(k, String(v));
        }
        if (proxy) return `${proxy}${cleanPath}${query.toString() ? `?${query.toString()}` : ""}`;
        query.set("api_key", key);
        return `https://api.themoviedb.org/3${cleanPath}?${query.toString()}`;
      }

      function mapTmdbResult(r, idx, forceType = "") {
        const title = r.title || r.name || "Untitled";
        const dateStr = r.release_date || r.first_air_date || "";
        const year = parseInt(dateStr.slice(0, 4), 10) || 2026;
        const isTv = forceType ? forceType === "tv" : r.media_type === "tv" || Boolean(r.name && !r.title);
        const genreIds = Array.isArray(r.genre_ids) ? r.genre_ids : [];
        const mappedKeys = [];
        const mappedLabels = [];
        for (const gid of genreIds) {
          const info = GENRE_MAP[gid];
          if (info) {
            if (!mappedKeys.includes(info.key)) mappedKeys.push(info.key);
            if (!mappedLabels.includes(info.label)) mappedLabels.push(info.label);
          }
        }
        if (!mappedLabels.length) mappedLabels.push(isTv ? "Show" : "Movie");
        const fb = FALLBACK_ITEMS[idx % FALLBACK_ITEMS.length];
        return {
          id: `tmdb-${isTv ? "tv" : "movie"}-${r.id}`,
          tmdbId: r.id,
          media_type: isTv ? "tv" : "movie",
          title,
          releaseDate: dateStr,
          year,
          rating: Number(r.vote_average || 0),
          popularity: Number(r.popularity || 50),
          poster_path: r.poster_path || "",
          genres: mappedKeys,
          genreLabels: mappedLabels,
          accent: fb.accent,
          overview: r.overview || "Explore full details, trailer, cast, and streaming platforms."
        };
      }

      async function loadNetflixCategories() {
        if (!hasTmdbSource()) {
          state.items = FALLBACK_ITEMS.slice();
          renderAll();
          return;
        }

        const q = state.query.trim();
        if (q) {
          try {
            const endpoint = state.mediaType === "movie" ? "/search/movie" : state.mediaType === "tv" ? "/search/tv" : "/search/multi";
            const res = await fetch(buildTmdbUrl(endpoint, { query: q, page: 1, include_adult: false }));
            if (res.ok) {
              const data = await res.json();
              state.items = (data.results || [])
                .filter((r) => r && r.media_type !== "person" && (r.title || r.name))
                .map((r, i) => mapTmdbResult(r, i, state.mediaType === "all" ? "" : state.mediaType));
            }
          } catch {}
          renderAll();
          return;
        }

        try {
          const endpoints = [
            ["trending", "/trending/all/week", ""],
            ["comingSoon", "/movie/upcoming", "movie", { sort_by: "popularity.desc" }],
            ["shows", "/tv/popular", "tv"],
            ["anime", "/discover/tv", "tv", { with_genres: 16, with_original_language: "ja", sort_by: "popularity.desc" }],
            ["action", "/discover/movie", "movie", { with_genres: 28, sort_by: "popularity.desc" }],
            ["scifi", "/discover/movie", "movie", { with_genres: 878, sort_by: "popularity.desc" }],
            ["thriller", "/discover/movie", "movie", { with_genres: 53, sort_by: "popularity.desc" }],
            ["crime", "/discover/tv", "tv", { with_genres: 80, sort_by: "popularity.desc" }],
            ["drama", "/discover/movie", "movie", { with_genres: 18, sort_by: "popularity.desc" }],
            ["comedy", "/discover/movie", "movie", { with_genres: 35, sort_by: "popularity.desc" }],
            ["horror", "/discover/movie", "movie", { with_genres: 27, sort_by: "popularity.desc" }],
            ["documentary", "/discover/movie", "movie", { with_genres: 99, sort_by: "popularity.desc" }]
          ];

          const settled = await Promise.allSettled(
            endpoints.map(([, path, , extra]) => fetch(buildTmdbUrl(path, { page: 1, ...(extra || {}) })))
          );

          const nextRows = {};
          for (let i = 0; i < endpoints.length; i++) {
            const [key, , forceType] = endpoints[i];
            const res = settled[i];
            if (res.status === "fulfilled" && res.value.ok) {
              const json = await res.value.json();
              nextRows[key] = (json.results || [])
                .filter((r) => r && r.media_type !== "person" && (r.title || r.name))
                .map((r, idx) => mapTmdbResult(r, idx, forceType));
            } else {
              nextRows[key] = [];
            }
          }

          const doomsdaySearch = await fetch(buildTmdbUrl("/search/movie", { query: "Avengers Doomsday", page: 1 }));
          if (doomsdaySearch.ok) {
            const ddData = await doomsdaySearch.json();
            const ddItems = (ddData.results || []).slice(0, 2).map((r, i) => mapTmdbResult(r, i, "movie"));
            const existingIds = new Set((nextRows.comingSoon || []).map((x) => x.id));
            nextRows.comingSoon = [...ddItems.filter((x) => !existingIds.has(x.id)), ...(nextRows.comingSoon || [])];
          }

          state.rows = nextRows;
          state.items = nextRows.trending && nextRows.trending.length ? nextRows.trending : FALLBACK_ITEMS.slice();
        } catch {
          state.items = FALLBACK_ITEMS.slice();
        }

        renderAll();
      }

      function isSaved(id) { return state.watchlist.some((x) => x.id === id); }
      function updateWatchlistBadge() { els.watchlistCount.textContent = String(state.watchlist.length); }

      function toggleWatchlist(item) {
        if (!item || !item.id) return;
        state.watchlist = isSaved(item.id) ? state.watchlist.filter((x) => x.id !== item.id) : [item, ...state.watchlist];
        saveWatchlist(state.watchlist);
        updateWatchlistBadge();
        renderAll();
      }

      function findItemById(id) {
        for (const list of Object.values(state.rows)) {
          if (Array.isArray(list)) {
            const hit = list.find((x) => x.id === id);
            if (hit) return hit;
          }
        }
        return state.items.find((x) => x.id === id) || state.watchlist.find((x) => x.id === id) || FALLBACK_ITEMS[0];
      }

      function renderHeroFeature() {
        const pool = state.items.length ? state.items : FALLBACK_ITEMS;
        const featured = pool.slice(0, Math.min(pool.length, 5));

        els.spotlightStrip.innerHTML = featured.map((item, idx) => {
          const saved = isSaved(item.id);
          const poster = getPosterUrl(item);
          const fallback = getFallbackPoster(item);
          const href = getItemPageUrl(item);
          const soon = isComingSoon(item.releaseDate);
          const headingTag = idx === 0 ? "h1" : "h2";
          const tagsLine = (item.genreLabels || []).slice(0, 3).join(" • ") || (item.media_type === "tv" ? "Show" : "Movie");
          const rankLabel = soon
            ? `COMING SOON • ${formatPrettyDate(item.releaseDate).toUpperCase()}`
            : `#${idx + 1} IN ${item.media_type === "tv" ? "SHOWS" : "MOVIES"} TODAY`;

          return `
            <article class="hero-card">
              <a class="hero-poster-link" href="${escapeAttr(href)}" title="${escapeAttr(item.title)}">
                <img src="${poster}" alt="${escapeAttr(item.title)} poster" loading="eager" onerror="if(this.src!==this.dataset.fb){this.src=this.dataset.fb;}" data-fb="${escapeAttr(fallback)}" />
                <div class="hero-overlay-caption">
                  <span class="hero-kicker">${escapeHtml(tagsLine)}</span>
                  <${headingTag} class="hero-title">${escapeHtml(item.title)}</${headingTag}>
                  <span class="hero-rank-badge">${escapeHtml(rankLabel)}</span>
                </div>
              </a>
              <div class="hero-cta-stack">
                <a class="hero-primary-btn" href="${escapeAttr(href)}">▶ Open Details &amp; Watch</a>
                <button class="hero-secondary-btn" data-hero-save="${escapeAttr(item.id)}" type="button">${saved ? "✓ In My List" : "+ My List"}</button>
              </div>
            </article>
          `;
        }).join("");

        if (els.heroDots) {
          els.heroDots.innerHTML = featured.map((_, i) => `<button class="hero-dot ${i === 0 ? "active" : ""}" data-hero-idx="${i}" type="button" aria-label="Slide ${i + 1}"></button>`).join("");
          els.heroDots.querySelectorAll("[data-hero-idx]").forEach((dot) => {
            dot.addEventListener("click", () => {
              const i = Number(dot.getAttribute("data-hero-idx") || 0);
              els.spotlightStrip.scrollTo({ left: i * els.spotlightStrip.clientWidth, behavior: "smooth" });
              els.heroDots.querySelectorAll(".hero-dot").forEach((d, idx) => d.classList.toggle("active", idx === i));
            });
          });
        }

        els.spotlightStrip.querySelectorAll("[data-hero-save]").forEach((btn) => {
          btn.addEventListener("click", (e) => { e.preventDefault(); e.stopPropagation(); toggleWatchlist(findItemById(btn.getAttribute("data-hero-save"))); });
        });
      }

      function renderCardHtml(item, rankNum = 0) {
        const poster = getPosterUrl(item);
        const fallback = getFallbackPoster(item);
        const saved = isSaved(item.id);
        const typeLabel = item.media_type === "tv" ? "Show" : "Movie";
        const href = getItemPageUrl(item);
        const soon = isComingSoon(item.releaseDate);

        const bottomBadge = soon
          ? `<span class="soon-badge">Soon • ${escapeHtml(formatPrettyDate(item.releaseDate))}</span>`
          : rankNum > 0
          ? `<span class="rank-badge-large">#${rankNum}</span>`
          : "";

        return `
          <article class="card">
            <a class="card-link-main" href="${escapeAttr(href)}">
              <div class="poster-box">
                <img src="${poster}" alt="${escapeAttr(item.title)} (${typeLabel}, ${item.year || "2026"}) poster" loading="lazy" onerror="if(this.src!==this.dataset.fb){this.src=this.dataset.fb;}" data-fb="${escapeAttr(fallback)}" />
                ${!soon && item.rating > 0 ? `<span class="rating-pill">★ ${Number(item.rating).toFixed(1)}</span>` : ""}
                ${bottomBadge}
              </div>
              <div class="card-body">
                <h3 class="card-title">${escapeHtml(item.title)}</h3>
                <div class="card-sub">
                  <span>${escapeHtml(soon ? formatPrettyDate(item.releaseDate) : String(item.year || "—"))}</span>
                  <span class="type-badge">${typeLabel}</span>
                </div>
              </div>
            </a>
            <button class="save-btn ${saved ? "saved" : ""}" data-save="${escapeAttr(item.id)}" type="button" title="${saved ? "Remove from list" : "Add to list"}" aria-label="Toggle list">${saved ? "✓" : "+"}</button>
          </article>
        `;
      }

      function bindSaveButtons(container) {
        if (!container) return;
        container.querySelectorAll("[data-save]").forEach((btn) => {
          btn.addEventListener("click", (e) => { e.preventDefault(); e.stopPropagation(); toggleWatchlist(findItemById(btn.getAttribute("data-save"))); });
        });
      }

      function hasActiveFilter() {
        return state.view !== "explore" || Boolean(state.query.trim()) || state.mediaType !== "all" || state.genre !== "all" || state.sort !== "popular";
      }

      function renderNetflixRows() {
        if (hasActiveFilter()) {
          els.netflixRowsSection.style.display = "none";
          els.netflixRowsSection.innerHTML = "";
          return;
        }

        const defs = [
          { id: "row-trending", trackId: "track-trending", title: "Trending Now", hubSlug: "trending", items: state.rows.trending, ranked: true },
          { id: "row-coming-soon", trackId: "track-coming-soon", title: "Coming Soon", hubSlug: "coming-soon", items: state.rows.comingSoon, ranked: false },
          { id: "row-shows", trackId: "track-shows", title: "Popular Shows", hubSlug: "shows", items: state.rows.shows, ranked: false },
          { id: "row-anime", trackId: "track-anime", title: "Anime", hubSlug: "anime", items: state.rows.anime, ranked: false },
          { id: "row-action", trackId: "track-action", title: "Action", hubSlug: "action", items: state.rows.action, ranked: false },
          { id: "row-scifi", trackId: "track-scifi", title: "Sci-Fi & Fantasy", hubSlug: "sci-fi", items: state.rows.scifi, ranked: false },
          { id: "row-thriller", trackId: "track-thriller", title: "Thrillers", hubSlug: "thrillers", items: state.rows.thriller, ranked: false },
          { id: "row-crime", trackId: "track-crime", title: "Crime Series", hubSlug: "crime", items: state.rows.crime, ranked: false },
          { id: "row-drama", trackId: "track-drama", title: "Drama", hubSlug: "drama", items: state.rows.drama, ranked: false },
          { id: "row-comedy", trackId: "track-comedy", title: "Comedy", hubSlug: "comedy", items: state.rows.comedy, ranked: false },
          { id: "row-horror", trackId: "track-horror", title: "Horror", hubSlug: "horror", items: state.rows.horror, ranked: false },
          { id: "row-documentary", trackId: "track-documentary", title: "Documentaries", hubSlug: "documentaries", items: state.rows.documentary, ranked: false }
        ].filter((r) => Array.isArray(r.items) && r.items.length > 0);

        els.netflixRowsSection.style.display = "flex";
        els.netflixRowsSection.innerHTML = defs.map((r) => `
          <div class="row-block" id="${escapeAttr(r.id)}">
            <div class="row-header">
              <div class="row-title-wrap">
                <h2 class="row-title"><a href="${escapeAttr(getCategoryHubUrl(r.hubSlug))}">${escapeHtml(r.title)}</a></h2>
              </div>
              <div class="row-actions">
                <a class="row-hub-link" href="${escapeAttr(getCategoryHubUrl(r.hubSlug))}">Category Page →</a>
                <button class="row-expand-btn" data-expand-track="${escapeAttr(r.trackId)}" type="button">Show All</button>
              </div>
            </div>
            <div class="row-scroller" id="${escapeAttr(r.trackId)}">
              ${r.items.map((it, i) => renderCardHtml(it, r.ranked && i < 10 ? i + 1 : 0)).join("")}
            </div>
          </div>
        `).join("");

        els.netflixRowsSection.querySelectorAll("[data-expand-track]").forEach((btn) => {
          btn.addEventListener("click", () => {
            const track = document.getElementById(btn.getAttribute("data-expand-track"));
            if (!track) return;
            const expanded = track.classList.toggle("expanded");
            btn.textContent = expanded ? "Collapse" : "Show All";
          });
        });

        bindSaveButtons(els.netflixRowsSection);
      }

      function getAllPool() {
        const merged = [...state.items, ...Object.values(state.rows).flat().filter(Boolean)];
        return Array.from(new Map(merged.map((x) => [x.id, x])).values());
      }

      function getFilteredItems() {
        const base = state.view === "watchlist" ? state.watchlist.slice() : getAllPool();
        const q = state.query.trim().toLowerCase();

        const list = base.filter((item) => {
          if (state.view === "shows" && item.media_type !== "tv") return false;
          if (state.view === "movies" && item.media_type !== "movie") return false;
          if (state.mediaType !== "all" && item.media_type !== state.mediaType) return false;
          if (state.genre !== "all") {
            const g = Array.isArray(item.genres) ? item.genres : [];
            if (!g.includes(state.genre)) return false;
          }
          if (q) {
            const hay = `${item.title || ""} ${item.overview || ""} ${(item.genreLabels || []).join(" ")}`.toLowerCase();
            if (!hay.includes(q)) return false;
          }
          return true;
        });

        list.sort((a, b) => {
          if (state.sort === "rating") return (b.rating || 0) - (a.rating || 0);
          if (state.sort === "year") return (b.year || 0) - (a.year || 0);
          if (state.sort === "title") return String(a.title || "").localeCompare(String(b.title || ""));
          return (b.popularity || 0) - (a.popularity || 0);
        });

        return list;
      }

      function renderFilteredGrid() {
        if (!hasActiveFilter()) {
          els.filteredSectionHead.style.display = "none";
          els.movieGrid.style.display = "none";
          els.movieGrid.innerHTML = "";
          return;
        }

        els.filteredSectionHead.style.display = "flex";
        els.movieGrid.style.display = "grid";

        const list = getFilteredItems();
        els.sectionTitle.textContent =
          state.view === "watchlist" ? "My List"
          : state.view === "shows" ? "TV Shows"
          : state.view === "movies" ? "Movies"
          : state.query.trim() ? `Search Results for "${state.query.trim()}"`
          : "Filtered Titles";
        els.resultMeta.textContent = `${list.length} ${list.length === 1 ? "title" : "titles"}`;

        if (!list.length) {
          els.movieGrid.innerHTML = `<div style="grid-column:1/-1;text-align:center;padding:28px;color:var(--muted);">No titles found.</div>`;
          return;
        }

        els.movieGrid.innerHTML = list.map((it) => renderCardHtml(it, 0)).join("");
        bindSaveButtons(els.movieGrid);
      }

      function renderGenreChips() {
        els.genreChips.innerHTML = CATEGORIES.map(
          (g) => `<button class="chip ${state.genre === g.id ? "active" : ""}" data-genre="${g.id}" type="button">${g.name}</button>`
        ).join("");
        els.genreChips.querySelectorAll(".chip").forEach((btn) => {
          btn.addEventListener("click", () => {
            state.genre = btn.getAttribute("data-genre") || "all";
            if (els.navCategorySelect) els.navCategorySelect.value = state.genre;
            renderAll();
          });
        });
      }

      function renderSeoHubLinks() {
        if (!els.seoHubLinks) return;
        const hubs = [
          { name: "Trending Now", slug: "trending" },
          { name: "Coming Soon", slug: "coming-soon" },
          { name: "Popular Shows", slug: "shows" },
          ...CATEGORIES.filter((c) => c.id !== "all")
        ];
        els.seoHubLinks.innerHTML = hubs.map((h) => `<a class="seo-hub-link" href="${escapeAttr(getCategoryHubUrl(h.slug))}">${escapeHtml(h.name)} →</a>`).join("");
      }

      function syncNavTabs() {
        els.exploreTabBtn.classList.toggle("active", state.view === "explore");
        els.showsTabBtn.classList.toggle("active", state.view === "shows");
        els.moviesTabBtn.classList.toggle("active", state.view === "movies");
        els.watchlistTabBtn.classList.toggle("active", state.view === "watchlist");
        els.typeChips.querySelectorAll(".chip").forEach((btn) => {
          btn.classList.toggle("active", btn.getAttribute("data-type") === state.mediaType);
        });
      }

      function resetAllFilters() {
        state.view = "explore";
        state.query = "";
        state.mediaType = "all";
        state.genre = "all";
        state.sort = "popular";
        els.searchInput.value = "";
        els.sortSelect.value = "popular";
        if (els.navCategorySelect) els.navCategorySelect.value = "all";
        syncNavTabs();
        loadNetflixCategories();
      }

      function renderAll() {
        syncNavTabs();
        renderGenreChips();
        renderHeroFeature();
        renderNetflixRows();
        renderFilteredGrid();
        renderSeoHubLinks();
      }

      function escapeHtml(str) {
        return String(str || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
      }

      function escapeAttr(str) { return escapeHtml(str).replace(/'/g, "&#39;"); }

      els.exploreTabBtn.addEventListener("click", () => { state.view = "explore"; state.mediaType = "all"; renderAll(); });
      els.showsTabBtn.addEventListener("click", () => { state.view = "shows"; state.mediaType = "tv"; renderAll(); });
      els.moviesTabBtn.addEventListener("click", () => { state.view = "movies"; state.mediaType = "movie"; renderAll(); });
      els.watchlistTabBtn.addEventListener("click", () => { state.view = "watchlist"; renderAll(); });
      if (els.navCategorySelect) {
        els.navCategorySelect.addEventListener("change", () => { state.genre = els.navCategorySelect.value || "all"; renderAll(); });
      }
      els.homeLink.addEventListener("click", (e) => { e.preventDefault(); if (els.spotlightStrip) els.spotlightStrip.scrollLeft = 0; resetAllFilters(); });

      let debounceTimer = null;
      els.searchInput.addEventListener("input", () => {
        clearTimeout(debounceTimer);
        debounceTimer = setTimeout(() => { state.query = els.searchInput.value; loadNetflixCategories(); }, 250);
      });
      els.searchForm.addEventListener("submit", (e) => { e.preventDefault(); state.query = els.searchInput.value; loadNetflixCategories(); });
      els.clearSearchBtn.addEventListener("click", () => { els.searchInput.value = ""; state.query = ""; loadNetflixCategories(); });

      els.typeChips.querySelectorAll(".chip").forEach((btn) => {
        btn.addEventListener("click", () => {
          state.mediaType = btn.getAttribute("data-type") || "all";
          if (state.mediaType === "tv") state.view = "shows";
          else if (state.mediaType === "movie") state.view = "movies";
          else if (state.view !== "watchlist") state.view = "explore";
          if (state.query.trim()) loadNetflixCategories();
          else renderAll();
        });
      });

      els.sortSelect.addEventListener("change", () => { state.sort = els.sortSelect.value; renderAll(); });

      mountAdBanner();
      updateWatchlistBadge();
      const urlQ = new URLSearchParams(window.location.search).get("q");
      if (urlQ) { state.query = urlQ; els.searchInput.value = urlQ; }
      renderAll();
      loadNetflixCategories();
    })();
  </script>
</body>
</html>
