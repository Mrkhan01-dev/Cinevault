name: Auto Generate CineVault SEO Pages

on:
  schedule:
    - cron: "0 */8 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-seo-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate SEO Movie & TV Pages + Sitemap
        run: node generate-seo.js

      - name: Commit and push updated pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html movie/ tv/ sitemap.xml favicon.svg
          if ! git diff --cached --quiet; then
            git commit -m "chore(seo): auto-refresh movie/tv pages and sitemap"
            git push
          else
            echo "No changes to commit."
          fi
