name: Auto-Generate Movie SEO Pages

on:
  schedule:
    - cron: '0 */8 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-pages:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run SEO page generator
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: node generate-seo.js

      - name: Commit and push generated pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add movie tv sitemap.xml
          if git diff --staged --quiet; then
            echo "No new changes to commit."
            exit 0
          fi
          git commit -m "Auto-update SEO movie pages & sitemap"
          git pull --rebase -X ours --autostash origin main
          git push origin main
          
