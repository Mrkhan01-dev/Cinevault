name: CineVault Catalog & SEO Page Generator

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:
    inputs:
      batch_limit:
        description: "Max new title pages to generate in this run (recommended: 40)"
        required: false
        default: "40"

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate CineVault pages, sitemap, and robots.txt
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          BATCH_LIMIT: ${{ github.event.inputs.batch_limit || '40' }}
        run: node generate-seo.js

      - name: Commit and push generated pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: sync CineVault catalog pages and sitemap"
            git push origin HEAD:main
          fi
