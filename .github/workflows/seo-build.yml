name: Auto Generate Movie SEO Pages

on:
  schedule:
    - cron: '0 0 * * *' # Runs automatically every day at midnight
  workflow_dispatch: # Allows you to click "Run workflow" manually anytime

permissions:
  contents: write

jobs:
  build-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run SEO page generator
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: node generate-seo.js

      - name: Commit and push generated pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@://github.com"
          git add movie/ sitemap.xml
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update SEO movie pages & sitemap" && git push)
